<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDA Schedule</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles/global-v2.css">
    <style>
        .schedule-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 1rem 4rem 1rem;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-out;
        }

        /* Top Filter & Control Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .sub-nav-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .sub-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 700;
            padding: 0.45rem 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sub-nav-btn:hover { color: #fff; }
        .sub-nav-btn.active { color: var(--gold-light); border-bottom: 2px solid var(--gold-mid); }

        .filter-select {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border-gold);
            color: var(--gold-light);
            border-radius: 6px;
            padding: 0.45rem 0.8rem;
            font-size: 0.82rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        /* Playoff Round Group Sections */
        .round-group-section {
            margin-bottom: 2.25rem;
        }

        .round-group-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1.75rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border-gold);
            font-family: 'Didot', serif;
        }

        .round-group-header:first-of-type {
            margin-top: 0.5rem;
        }

        .round-group-title {
            font-size: 1.35rem;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .round-group-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-mid);
            border: 1px solid rgba(212, 175, 55, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.75px;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Slate Cards */
        .slate-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            margin-bottom: 1.25rem;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .slate-card.current-slate {
            border-color: var(--border-gold);
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.75) 0%, rgba(15, 23, 42, 0.85) 100%);
        }

        .slate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.35);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .slate-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .slate-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Sports Chips at Top of Daily Section */
        .slate-sports-banner {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .slate-sport-pill {
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: var(--gold-light);
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .slate-badge {
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-reg { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }
        .badge-pre { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-playoffs { background: rgba(212, 175, 55, 0.2); color: var(--gold-mid); border: 1px solid var(--border-gold); }
        .badge-today { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }

        .slate-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Matchup Grid & Game Item */
        .matchup-grid {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 0.5rem !important;
            padding: 0.6rem !important;
        }

        .game-brief-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            padding: 0.5rem 0.65rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            transition: all 0.2s ease;
        }
        .game-brief-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-gold);
            transform: translateY(-1px);
        }

        .brief-team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brief-team-info {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .brief-team-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brief-team-name.winner {
            color: #fff;
            font-weight: 900;
        }

        .brief-team-name.placeholder {
            color: #94a3b8;
            font-style: italic;
        }

        .brief-score-display {
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .brief-score-display.winning-score {
            color: var(--gold-mid);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .brief-game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 0.3rem;
            font-size: 0.6rem;
            color: var(--text-muted);
        }

        .team-logo {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex-shrink: 0;
        }

        /* Sport Breakdown Collapsible Cards */
        .sport-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            overflow: hidden;
        }
        .sport-header-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0.6rem 0.85rem;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-subtle);
            gap: 1rem;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }
        .sport-header-row:hover { background: rgba(255, 255, 255, 0.06); }
        .box-score-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            padding: 0.75rem;
            gap: 0.75rem;
            background: rgba(0,0,0,0.2);
        }
        .sport-card.open .box-score-container { display: grid; }
        .sport-card.open .sport-toggle { transform: rotate(180deg); }
        .sport-toggle { transition: transform 0.25s ease; display: inline-block; }

        .rookie-tag {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold-mid);
            border: 1px solid rgba(212, 175, 55, 0.35);
            font-size: 0.5rem;
            font-weight: 800;
            padding: 1px 3px;
            border-radius: 2px;
            margin-left: 4px;
        }

        /* Sports Breakdown in Modal */
        .sports-breakdown-section {
            margin-bottom: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 0.75rem;
        }
        .sports-breakdown-title {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--gold-mid);
            text-transform: uppercase;
            letter-spacing: 0.75px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sports-breakdown-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 6px;
        }
        .sport-breakdown-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 5px 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sport-breakdown-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sport-breakdown-name {
            font-size: 0.68rem;
            font-weight: 800;
            color: #cbd5e1;
            text-transform: uppercase;
        }
        .sport-breakdown-winner-badge {
            font-size: 0.55rem;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 3px;
            line-height: 1.1;
        }
        .sport-breakdown-winner-badge.t1 {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold-mid);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .sport-breakdown-winner-badge.t2 {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .sport-breakdown-scores {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .sport-breakdown-scores .score.win {
            color: #fff;
            font-weight: 800;
        }

        /* Modal Breakdown */
        .game-detail-modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 9999;
            backdrop-filter: blur(6px); padding: 1rem;
        }
        .game-detail-modal {
            background: var(--bg-navy); border: 1px solid var(--border-gold); border-radius: 12px;
            padding: 1.5rem; max-width: 650px; width: 100%; max-height: 85vh; overflow-y: auto;
            position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease-out;
        }
        .game-detail-close {
            position: absolute; top: 1rem; right: 1rem; background: none; border: none;
            color: #888; font-size: 1.5rem; cursor: pointer; line-height: 1;
        }
        .game-detail-close:hover { color: #fff; }

        @media (max-width: 650px) {
            .schedule-content { padding: 0.5rem 0.5rem 3rem 0.5rem; }
            .controls-bar { flex-direction: column; align-items: stretch; gap: 0.5rem; }
            .filter-select { width: 100%; }
            .matchup-grid { gap: 0.4rem !important; padding: 0.4rem !important; }
            .slate-header { flex-direction: column; align-items: flex-start; gap: 0.4rem; }
            .slate-meta { align-self: flex-start; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <h1>RDA Schedule</h1>

    <div class="schedule-content">
        <!-- Control Bar -->
        <div class="controls-bar">
            <div class="sub-nav-container">
                <button class="sub-nav-btn active" id="tab-all" onclick="filterType('all')">All Games</button>
                <button class="sub-nav-btn" id="tab-preseason" onclick="filterType('preseason')">Preseason (4)</button>
                <button class="sub-nav-btn" id="tab-regular" onclick="filterType('regular')">Regular Season (21)</button>
                <button class="sub-nav-btn" id="tab-playoffs" onclick="filterType('playoffs')">Playoffs</button>
            </div>
            <select class="filter-select" id="team-filter" onchange="filterTeam(this.value)">
                <option value="ALL">All Franchises</option>
            </select>
        </div>

        <div id="schedule-container">
            <div style="text-align: center; color: var(--gold-mid); padding: 3rem; font-style: italic;">Loading league schedule...</div>
        </div>
    </div>

    <script type="module">
        import { initNav, getSeasonData, currentSeason, getTeamLogoPath, parseCsvToObject } from './js/app.js?v=7';
        initNav();

        const workerProxy = 'https://rda-worker.coledecker04.workers.dev/';

        const seasonConfig = {
            '4': {
                players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7pZmpj4lJiBMkcjcgzJ77n2xmFIRlmuD-0Zuakz8lZekYobXkmTjfaEwhJYdNuM5F9VKlDm-FPaw8/pub?output=csv',
                scheduleUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS93Cbk4JUmCBgtIR1-RnSHlYY9E-dxEEWVT_Jx-T_Lm07oa6KYlnBGAqaGJin4VBpG4GmOGn8ktTPy/pub?gid=1921814921&single=true&output=csv'
            },
            '5': {
                players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7pZmpj4lJiBMkcjcgzJ77n2xmFIRlmuD-0Zuakz8lZekYobXkmTjfaEwhJYdNuM5F9VKlDm-FPaw8/pub?output=csv',
                scheduleUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS93Cbk4JUmCBgtIR1-RnSHlYY9E-dxEEWVT_Jx-T_Lm07oa6KYlnBGAqaGJin4VBpG4GmOGn8ktTPy/pub?gid=44168754&single=true&output=csv'
            },
            '6': {
                players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7pZmpj4lJiBMkcjcgzJ77n2xmFIRlmuD-0Zuakz8lZekYobXkmTjfaEwhJYdNuM5F9VKlDm-FPaw8/pub?output=csv',
                scheduleUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS93Cbk4JUmCBgtIR1-RnSHlYY9E-dxEEWVT_Jx-T_Lm07oa6KYlnBGAqaGJin4VBpG4GmOGn8ktTPy/pub?gid=1595040071&single=true&output=csv'
            }
        };

        const activeConfig = seasonConfig[currentSeason] || seasonConfig['6'];

        async function fetchViaWorker(url) {
            if (!url) return null;
            try {
                const res = await fetch(`${workerProxy}?url=${encodeURIComponent(url)}`);
                if (!res.ok) return null;
                return await res.text();
            } catch (e) {
                return null;
            }
        }

        function parseGameDate(dateStr) {
            if (!dateStr) return 0;
            const parts = dateStr.split('/');
            if (parts.length >= 2) {
                const m = parseInt(parts[0], 10) - 1;
                const d = parseInt(parts[1], 10);
                let y = new Date().getFullYear();
                if (parts.length === 3) y = parseInt(parts[2], 10);
                if (y < 100) y += 2000;
                return new Date(y, m, d).getTime();
            }
            return new Date(dateStr).getTime() || 0;
        }

        function getTodayDateEST() {
            const now = new Date();
            const options = { timeZone: "America/New_York", month: 'numeric', day: 'numeric' };
            return new Intl.DateTimeFormat('en-US', options).format(now);
        }

        const KNOWN_SPORTS = new Set(['MLB', 'NBA', 'NFL', 'CFB', 'CBB', 'NHL', 'FC', 'SOCCER', 'WNBA', 'GOLF']);

        function extractSportsFromRow(r) {
            const sports = new Set();
            if (!r) return [];
            for (const [k, v] of Object.entries(r)) {
                if (!v || typeof v !== 'string') continue;
                v.split(/[,/]/).forEach(item => {
                    const clean = item.trim().toUpperCase();
                    if (KNOWN_SPORTS.has(clean)) {
                        sports.add(clean === 'SOCCER' ? 'FC' : clean);
                    }
                });
            }
            return Array.from(sports);
        }

        function getRowPlayoffRound(r) {
            if (!r) return null;
            for (const [k, v] of Object.entries(r)) {
                if (!v || typeof v !== 'string') continue;
                const lowerK = k.toLowerCase().trim();
                const lowerV = v.toLowerCase().trim();

                if (lowerK.includes('round')) {
                    if (lowerV.includes('wild')) return 'Wild Card';
                    if (lowerV.includes('conf')) return 'Conference Finals';
                    if (lowerV.includes('final')) return 'Finals';
                    if (lowerV) return v.trim();
                }

                if (lowerV === 'wild card' || lowerV === 'wildcard') return 'Wild Card';
                if (lowerV === 'conference finals' || lowerV === 'conf finals') return 'Conference Finals';
                if (lowerV === 'finals' || lowerV === 'championship') return 'Finals';
            }
            return null;
        }

        function checkPlayoffRow(r) {
            if (!r) return false;
            if (getRowPlayoffRound(r)) return true;
            for (const [k, v] of Object.entries(r)) {
                if (typeof v === 'string') {
                    const lower = v.trim().toLowerCase();
                    if (lower === 'playoffs' || lower === 'playoff' || lower === 'postseason' || lower.includes('playoff')) {
                        return true;
                    }
                }
            }
            return false;
        }

        function checkPreseasonRow(r) {
            if (!r) return false;
            for (const [k, v] of Object.entries(r)) {
                if (typeof v === 'string') {
                    const lower = v.trim().toLowerCase();
                    if (lower === 'preseason' || lower === 'pre-season' || lower.includes('preseason')) {
                        return true;
                    }
                }
            }
            return false;
        }

        let allSlates = [];
        let allPlayersRoster = [];
        let liveSnapshotData = null;
        let currentTypeFilter = 'all';
        let currentTeamFilter = 'ALL';

        window.filterType = (type) => {
            currentTypeFilter = type;
            document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${type}`).classList.add('active');
            renderSchedule();
        };

        window.filterTeam = (team) => {
            currentTeamFilter = team;
            renderSchedule();
        };

        async function init() {
            const [scheduleText, allGames, allPlayoffGames, playersRawText, playoffPlayersText, snapRes] = await Promise.all([
                fetchViaWorker(activeConfig.scheduleUrl),
                getSeasonData('games'),
                getSeasonData('playoff-games'),
                getSeasonData('players'),
                getSeasonData('playoff-players'),
                fetch(`${workerProxy}snapshot`).catch(() => null)
            ]);

            if (snapRes && snapRes.ok) {
                try { liveSnapshotData = await snapRes.json(); } catch (e) {}
            }

            allPlayersRoster = [...(allGames ? [] : []), ...(allPlayersRoster || []), ...[...(playersRawText || []), ...(playoffPlayersText || [])]];

            const completedGamesMap = {};
            const registerGame = (g, isPlayoff) => {
                const t1 = (g.team1 || g['team 1'] || '').trim().toLowerCase();
                const t2 = (g.team2 || g['team 2'] || '').trim().toLowerCase();
                const d = (g.date || '').trim();
                if (!t1 || !t2 || !d) return;
                completedGamesMap[`${d}_${t1}_${t2}`] = { ...g, isPlayoff };
                completedGamesMap[`${d}_${t2}_${t1}`] = { ...g, isPlayoff };
            };
            (allGames || []).forEach(g => registerGame(g, false));
            (allPlayoffGames || []).forEach(g => registerGame(g, true));

            const rawSchedule = parseCsvToObject(scheduleText);
            const teamSet = new Set();
            const dateGroups = {};

            rawSchedule.forEach(r => {
                let t1 = (r.team1 || r['team 1'] || r.away || r['away team'] || '').trim();
                let t2 = (r.team2 || r['team 2'] || r.home || r['home team'] || '').trim();
                const date = (r.date || r.Date || '').trim();
                if (!date) return;

                const isPlayoff = checkPlayoffRow(r);
                const isPreseason = checkPreseasonRow(r);
                const playoffRound = getRowPlayoffRound(r);

                if (!dateGroups[date]) {
                    dateGroups[date] = {
                        date,
                        sortDate: parseGameDate(date),
                        isPlayoff: false,
                        isPreseason: false,
                        playoffRound: null,
                        sports: new Set(),
                        games: []
                    };
                }

                if (isPlayoff) dateGroups[date].isPlayoff = true;
                if (isPreseason) dateGroups[date].isPreseason = true;
                if (playoffRound && !dateGroups[date].playoffRound) {
                    dateGroups[date].playoffRound = playoffRound;
                }

                const gameIdxInDate = dateGroups[date].games.length;

                // Handle blank games with East and West placeholders
                let isPlaceholder = false;
                if (!t1 && !t2) {
                    isPlaceholder = true;
                    const roundName = playoffRound || dateGroups[date].playoffRound || '';
                    if (roundName === 'Finals') {
                        t1 = 'East Champion';
                        t2 = 'West Champion';
                    } else if (roundName === 'Conference Finals') {
                        if (gameIdxInDate % 2 === 0) {
                            t1 = 'East Finalist 1';
                            t2 = 'East Finalist 2';
                        } else {
                            t1 = 'West Finalist 1';
                            t2 = 'West Finalist 2';
                        }
                    } else {
                        // Wild Card / Generic Playoff placeholders
                        if (gameIdxInDate < 2) {
                            t1 = `East Placeholder ${gameIdxInDate * 2 + 1}`;
                            t2 = `East Placeholder ${gameIdxInDate * 2 + 2}`;
                        } else {
                            t1 = `West Placeholder ${(gameIdxInDate - 2) * 2 + 1}`;
                            t2 = `West Placeholder ${(gameIdxInDate - 2) * 2 + 2}`;
                        }
                    }
                } else if (!t1) {
                    t1 = 'TBD';
                } else if (!t2) {
                    t2 = 'TBD';
                }

                if (!isPlaceholder) {
                    if (t1 !== 'TBD') teamSet.add(t1);
                    if (t2 !== 'TBD') teamSet.add(t2);
                }

                const rowSports = extractSportsFromRow(r);
                rowSports.forEach(s => dateGroups[date].sports.add(s));

                const completed = completedGamesMap[`${date}_${t1.toLowerCase()}_${t2.toLowerCase()}`];

                let s1Series = 0, s2Series = 0;
                let t1Pts = 0, t2Pts = 0;
                let gameWinner = null;
                let isSwapped = false;

                if (completed) {
                    isSwapped = (completed.team1 || '').trim().toLowerCase() === t2.toLowerCase();
                    gameWinner = completed.winner || null;
                }

                const t1PAll = allPlayersRoster.filter(p => p.team && p.team.toLowerCase() === t1.toLowerCase() && p.date === date);
                const t2PAll = allPlayersRoster.filter(p => p.team && p.team.toLowerCase() === t2.toLowerCase() && p.date === date);

                const sportMap1 = {}, sportMap2 = {};
                t1PAll.forEach(p => { 
                    if (p.sport) { 
                        const sp = p.sport.toUpperCase();
                        dateGroups[date].sports.add(sp);
                        const isB = p.isBench || p.isbench || p.bench === true || String(p.bench).toLowerCase() === 'true';
                        sportMap1[sp] = (sportMap1[sp] || 0) + (!isB ? parseFloat(p.score || 0) : 0); 
                    } 
                });
                t2PAll.forEach(p => { 
                    if (p.sport) { 
                        const sp = p.sport.toUpperCase();
                        dateGroups[date].sports.add(sp);
                        const isB = p.isBench || p.isbench || p.bench === true || String(p.bench).toLowerCase() === 'true';
                        sportMap2[sp] = (sportMap2[sp] || 0) + (!isB ? parseFloat(p.score || 0) : 0); 
                    } 
                });

                const allSportKeys = new Set([...Object.keys(sportMap1), ...Object.keys(sportMap2)]);
                if (allSportKeys.size > 0) {
                    allSportKeys.forEach(sp => {
                        const sc1 = sportMap1[sp] || 0;
                        const sc2 = sportMap2[sp] || 0;
                        if (sc1 > sc2) s1Series++;
                        else if (sc2 > sc1) s2Series++;
                    });
                    t1Pts = Object.values(sportMap1).reduce((a,b)=>a+b, 0);
                    t2Pts = Object.values(sportMap2).reduce((a,b)=>a+b, 0);
                } else if (completed) {
                    const rawS1 = parseFloat(completed.team1score ?? completed['team 1 score']) || 0;
                    const rawS2 = parseFloat(completed.team2score ?? completed['team 2 score']) || 0;
                    const ser1 = parseInt(completed.team1SeriesWins ?? completed.team1series, 10);
                    const ser2 = parseInt(completed.team2SeriesWins ?? completed.team2series, 10);
                    if (!isNaN(ser1) && !isNaN(ser2)) { s1Series = ser1; s2Series = ser2; t1Pts = rawS1; t2Pts = rawS2; }
                    else { s1Series = rawS1 <= 10 ? rawS1 : 0; s2Series = rawS2 <= 10 ? rawS2 : 0; t1Pts = rawS1; t2Pts = rawS2; }
                }

                const gameObj = {
                    team1: t1,
                    team2: t2,
                    date,
                    type: isPlayoff ? 'Playoffs' : (isPreseason ? 'Preseason' : 'Regular'),
                    playoffRound: playoffRound || dateGroups[date].playoffRound,
                    isPlaceholder,
                    s1Series,
                    s2Series,
                    t1Pts,
                    t2Pts,
                    winner: gameWinner,
                    isCompleted: !!completed,
                    activeSports: rowSports
                };

                gameObj.sportsBreakdown = extractSportBreakdown(gameObj, completed, isSwapped, liveSnapshotData);
                (gameObj.sportsBreakdown || []).forEach(sb => { if (sb.sport) dateGroups[date].sports.add(sb.sport); });

                dateGroups[date].games.push(gameObj);
            });

            const teamSelect = document.getElementById('team-filter');
            Array.from(teamSet).sort().forEach(team => {
                const opt = document.createElement('option');
                opt.value = team;
                opt.textContent = team;
                teamSelect.appendChild(opt);
            });

            const sortedDates = Object.values(dateGroups).sort((a, b) => a.sortDate - b.sortDate);
            let preSlateIndex = 1;
            let regSlateIndex = 1;
            const roundGameIndexMap = { 'Wild Card': 1, 'Conference Finals': 1, 'Finals': 1 };
            const hasPreseasonTag = sortedDates.some(s => s.isPreseason);

            allSlates = sortedDates.map(slate => {
                let slateLabel = '';
                const isPre = slate.isPreseason || (!hasPreseasonTag && !slate.isPlayoff && preSlateIndex <= 4);

                if (slate.isPlayoff) {
                    const rName = slate.playoffRound || 'Wild Card';
                    if (!roundGameIndexMap[rName]) roundGameIndexMap[rName] = 1;
                    slateLabel = `${rName} • Game ${roundGameIndexMap[rName]++}`;
                } else if (isPre) {
                    slate.isPreseason = true;
                    slateLabel = `Preseason • Game ${preSlateIndex++} of 4`;
                } else {
                    slateLabel = `Game ${regSlateIndex++} of 21`;
                }

                return { 
                    ...slate, 
                    label: slateLabel,
                    sportsList: Array.from(slate.sports || []).sort()
                };
            });

            renderSchedule();
        }

        function renderRosterSection(team1, team2, gameDate) {
            const cleanDate = gameDate.trim();
            const t1Players = allPlayersRoster.filter(p => p.team && p.team.toLowerCase() === team1.toLowerCase() && p.date === cleanDate);
            const t2Players = allPlayersRoster.filter(p => p.team && p.team.toLowerCase() === team2.toLowerCase() && p.date === cleanDate);

            const sportsSet = new Set();
            [...t1Players, ...t2Players].forEach(p => { if (p.sport) sportsSet.add(p.sport); });
            const sortedSports = Array.from(sportsSet).sort();

            if (!sortedSports.length) {
                return '<div style="color:#666; font-size:0.75rem; font-style:italic; padding:0.5rem; text-align:center;">No box scores logged for this game.</div>';
            }

            const renderSportPlayers = (plist) => {
                const starters = plist.filter(p => !(p.isBench || p.isbench || p.bench === true || String(p.bench).toLowerCase() === 'true'));
                const bench = plist.filter(p => p.isBench || p.isbench || p.bench === true || String(p.bench).toLowerCase() === 'true');

                let html = '';
                if (starters.length > 0) {
                    html += `<div style="font-size:0.58rem; color:var(--text-muted); font-weight:700; text-transform:uppercase; margin-bottom:2px;">Starters (${starters.length})</div>`;
                    html += starters.map(p => `
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#ccc; padding:2px 4px;">
                            <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.username}${p.isRookie ? ' <span class="rookie-tag">R</span>' : ''}</span>
                            <span style="font-weight:700; color:#fff;">${parseFloat(p.score || 0).toFixed(2)}</span>
                        </div>
                    `).join('');
                }
                if (bench.length > 0) {
                    html += `<div style="font-size:0.58rem; color:var(--text-muted); font-weight:700; text-transform:uppercase; margin:4px 0 2px 0;">Bench (${bench.length})</div>`;
                    html += bench.map(p => `
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#888; padding:2px 4px; opacity:0.6;">
                            <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${p.username}</span>
                            <span style="font-weight:700; color:#ccc;">${parseFloat(p.score || 0).toFixed(2)}</span>
                        </div>
                    `).join('');
                }
                return html || '<div style="color:#666; font-size:0.7rem;">None</div>';
            };

            let html = sortedSports.map(sport => {
                const p1Sport = t1Players.filter(p => p.sport === sport).sort((a,b) => (parseFloat(b.score)||0) - (parseFloat(a.score)||0));
                const p2Sport = t2Players.filter(p => p.sport === sport).sort((a,b) => (parseFloat(b.score)||0) - (parseFloat(a.score)||0));

                const s1 = p1Sport.filter(p => !(p.isBench || p.isbench || p.bench === true || String(p.bench).toLowerCase() === 'true')).reduce((sum, p) => sum + parseFloat(p.score || 0), 0);
                const s2 = p2Sport.filter(p => !(p.isBench || p.isbench || p.bench === true || String(p.bench).toLowerCase() === 'true')).reduce((sum, p) => sum + parseFloat(p.score || 0), 0);

                const s1Class = s1 > s2 ? 'winning-score' : '';
                const s2Class = s2 > s1 ? 'winning-score' : '';

                return `
                    <div class="sport-card">
                        <div class="sport-header-row" onclick="this.parentElement.classList.toggle('open');">
                            <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${team1}</div>
                            <div style="display:flex; flex-direction:column; align-items:center;">
                                <div style="display:flex; gap:0.4rem; align-items:center; font-size:0.95rem; font-weight:800;">
                                    <span class="${s1Class}" style="${s1 > s2 ? 'color:var(--gold-mid);' : 'color:#fff;'}">${s1.toFixed(2)}</span>
                                    <span style="color:var(--text-muted);">-</span>
                                    <span class="${s2Class}" style="${s2 > s1 ? 'color:var(--gold-mid);' : 'color:#fff;'}">${s2.toFixed(2)}</span>
                                </div>
                                <div style="font-size:0.58rem; color:var(--gold-dark); font-weight:800; text-transform:uppercase; margin-top:1px;">${sport} <span class="sport-toggle">▼</span></div>
                            </div>
                            <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${team2}</div>
                        </div>
                        <div class="box-score-container">
                            <div style="border-right:1px solid var(--border-subtle); padding-right:0.5rem;">${renderSportPlayers(p1Sport)}</div>
                            <div>${renderSportPlayers(p2Sport)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            const groupPlayers = (pList) => {
                const map = {};
                pList.forEach(p => {
                    const isBench = p.isBench || p.isbench || p.bench === true || String(p.bench).toLowerCase() === 'true';
                    if (!map[p.username]) {
                        map[p.username] = { username: p.username, score: 0, isBench: isBench, isRookie: p.isRookie };
                    }
                    map[p.username].score += parseFloat(p.score || 0);
                    if (!isBench) map[p.username].isBench = false;
                });
                return Object.values(map).sort((a,b) => b.score - a.score);
            };

            const t1Totals = groupPlayers(t1Players);
            const t2Totals = groupPlayers(t2Players);
            const totalS1 = t1Totals.filter(p => !p.isBench).reduce((sum, p) => sum + p.score, 0);
            const totalS2 = t2Totals.filter(p => !p.isBench).reduce((sum, p) => sum + p.score, 0);

            const t1TotalClass = totalS1 > totalS2 ? 'winning-score' : '';
            const t2TotalClass = totalS2 > totalS1 ? 'winning-score' : '';

            html += `
                <div class="sport-card total-card" style="border: 1px solid var(--border-gold); background: rgba(212, 175, 55, 0.04); margin-top: 1rem;">
                    <div class="sport-header-row" onclick="this.parentElement.classList.toggle('open');">
                        <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${team1}</div>
                        <div style="display:flex; flex-direction:column; align-items:center;">
                            <div style="display:flex; gap:0.4rem; align-items:center; font-size:1rem; font-weight:900;">
                                <span class="${t1TotalClass}" style="${totalS1 > totalS2 ? 'color:var(--gold-light);' : 'color:#fff;'}">${totalS1.toFixed(2)}</span>
                                <span style="color:var(--text-muted);">-</span>
                                <span class="${t2TotalClass}" style="${totalS2 > totalS1 ? 'color:var(--gold-light);' : 'color:#fff;'}">${totalS2.toFixed(2)}</span>
                            </div>
                            <div style="font-size:0.6rem; color:var(--gold-mid); font-weight:900; text-transform:uppercase; margin-top:1px;">TOTAL <span class="sport-toggle">▼</span></div>
                        </div>
                        <div style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${team2}</div>
                    </div>
                    <div class="box-score-container">
                        <div style="border-right:1px solid var(--border-subtle); padding-right:0.5rem;">${renderSportPlayers(t1Totals)}</div>
                        <div>${renderSportPlayers(t2Totals)}</div>
                    </div>
                </div>
            `;

            return html;
        }

        function extractSportBreakdown(g, completed, isSwapped, liveSnap) {
            const breakdown = [];
            const sportsSet = new Set(g.activeSports || []);

            if (completed) {
                Object.keys(completed).forEach(k => {
                    const upper = k.toUpperCase().replace(/[^A-Z]/g, '');
                    KNOWN_SPORTS.forEach(ks => {
                        if (upper.includes(ks)) sportsSet.add(ks === 'SOCCER' ? 'FC' : ks);
                    });
                });
            }

            sportsSet.forEach(sport => {
                let sc1 = null, sc2 = null, sportWinner = null;
                const normSport = sport.toUpperCase() === 'SOCCER' ? 'FC' : sport.toUpperCase();

                if (liveSnap && liveSnap.teamsDataCache) {
                    const t1P = liveSnap.teamsDataCache[g.team1] || [];
                    const t2P = liveSnap.teamsDataCache[g.team2] || [];
                    const sumT1 = t1P.filter(p => !p.isBench).reduce((acc, p) => acc + (typeof p.scoresBySport?.[normSport] === 'number' ? p.scoresBySport[normSport] : 0), 0);
                    const sumT2 = t2P.filter(p => !p.isBench).reduce((acc, p) => acc + (typeof p.scoresBySport?.[normSport] === 'number' ? p.scoresBySport[normSport] : 0), 0);
                    if (sumT1 > 0 || sumT2 > 0) {
                        sc1 = sumT1;
                        sc2 = sumT2;
                    }
                }

                if (completed && sc1 === null && sc2 === null) {
                    const findVal = (names) => {
                        for (const n of names) {
                            for (const k in completed) {
                                if (k.toLowerCase().replace(/[\s_-]/g, '') === n.toLowerCase().replace(/[\s_-]/g, '')) {
                                    return completed[k];
                                }
                            }
                        }
                        return null;
                    };

                    const val1 = findVal([
                        isSwapped ? `${normSport}2` : `${normSport}1`,
                        isSwapped ? `${normSport}_2` : `${normSport}_1`,
                        isSwapped ? `team2_${normSport}` : `team1_${normSport}`,
                        isSwapped ? `${normSport}_team2` : `${normSport}_team1`
                    ]);
                    const val2 = findVal([
                        isSwapped ? `${normSport}1` : `${normSport}2`,
                        isSwapped ? `${normSport}_1` : `${normSport}_2`,
                        isSwapped ? `team1_${normSport}` : `team2_${normSport}`,
                        isSwapped ? `${normSport}_team1` : `${normSport}_team2`
                    ]);

                    if (val1 !== null && val2 !== null && val1 !== '' && val2 !== '') {
                        sc1 = parseFloat(val1);
                        sc2 = parseFloat(val2);
                    } else {
                        const direct = findVal([normSport, normSport.toLowerCase()]);
                        if (direct) {
                            const str = String(direct).trim();
                            if (str.includes('-')) {
                                const parts = str.split('-');
                                sc1 = parseFloat(isSwapped ? parts[1] : parts[0]);
                                sc2 = parseFloat(isSwapped ? parts[0] : parts[1]);
                            } else if (str.toLowerCase() === g.team1.toLowerCase()) {
                                sportWinner = g.team1;
                            } else if (str.toLowerCase() === g.team2.toLowerCase()) {
                                sportWinner = g.team2;
                            }
                        }
                    }
                }

                if (sc1 !== null && sc2 !== null && (!isNaN(sc1) || !isNaN(sc2))) {
                    sc1 = isNaN(sc1) ? 0 : sc1;
                    sc2 = isNaN(sc2) ? 0 : sc2;
                    if (sc1 > sc2) sportWinner = g.team1;
                    else if (sc2 > sc1) sportWinner = g.team2;
                    else sportWinner = 'TIE';
                }

                breakdown.push({
                    sport: normSport,
                    score1: sc1,
                    score2: sc2,
                    winner: sportWinner
                });
            });

            return breakdown;
        }

        function renderSportsBreakdownHtml(breakdown, team1, team2) {
            if (!breakdown || !breakdown.length) return '';
            return `
                <div class="sports-breakdown-section">
                    <div class="sports-breakdown-title">
                        <span>Sports Breakdown</span>
                        <span>Score / Result</span>
                    </div>
                    <div class="sports-breakdown-grid">
                        ${breakdown.map(sb => {
                            const t1Win = sb.winner === team1;
                            const t2Win = sb.winner === team2;
                            let badgeHtml = '';
                            if (t1Win) badgeHtml = `<span class="sport-breakdown-winner-badge t1">${team1}</span>`;
                            else if (t2Win) badgeHtml = `<span class="sport-breakdown-winner-badge t2">${team2}</span>`;
                            else if (sb.winner === 'TIE') badgeHtml = `<span class="sport-breakdown-winner-badge" style="background:rgba(255,255,255,0.1);color:#cbd5e1;">TIE</span>`;

                            const hasScores = sb.score1 !== null && sb.score2 !== null;
                            return `
                                <div class="sport-breakdown-card">
                                    <div class="sport-breakdown-top">
                                        <span class="sport-breakdown-name">${sb.sport}</span>${badgeHtml}
                                    </div>
                                    ${hasScores ? `
                                        <div class="sport-breakdown-scores">
                                            <span class="score ${t1Win ? 'win' : ''}">${sb.score1.toFixed(1)}</span>
                                            <span style="color:#555;font-size:0.65rem;">vs</span>
                                            <span class="score ${t2Win ? 'win' : ''}">${sb.score2.toFixed(1)}</span>
                                        </div>
                                    ` : ''}
                                </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }

        function renderSlateCardHtml(slate, todayStr) {
            const isToday = slate.date === todayStr;
            const completedCount = slate.games.filter(g => g.isCompleted).length;
            const totalCount = slate.games.length;

            let badgeText = slate.isPlayoff ? (slate.playoffRound || 'Playoffs') : (slate.isPreseason ? 'Preseason' : 'Regular');
            let badgeClass = slate.isPlayoff ? 'badge-playoffs' : (slate.isPreseason ? 'badge-pre' : 'badge-reg');
            let statusBadge = `<span class="slate-badge ${badgeClass}">${badgeText}</span>`;
            if (isToday) {
                statusBadge = `<span class="slate-badge badge-today">Today</span>`;
            }

            const sportsBadgesHtml = (slate.sportsList || []).length > 0 ? `
                <div class="slate-sports-banner">
                    ${slate.sportsList.map(s => `<span class="slate-sport-pill">${s}</span>`).join('')}
                </div>

            return `
                <div class="slate-card ${isToday ? 'current-slate' : ''}">
                    <div class="slate-header">
                        <div class="slate-header-left">
                            <div class="slate-title">
                                <span>${slate.label}</span>
                                ${statusBadge}
                            </div>
                            ${sportsBadgesHtml}
                        </div>
                        <div class="slate-meta">
                            ${slate.date} &bull; ${completedCount}/${totalCount} Final
                        </div>
                    </div>
                    <div class="matchup-grid">
                        ${slate.games.map(g => {
                            const isFinal = g.isCompleted;
                            const t1Wins = g.s1Series !== null ? g.s1Series : 0;
                            const t2Wins = g.s2Series !== null ? g.s2Series : 0;

                            let t1IsWinner = false;
                            let t2IsWinner = false;
                            let wonByTiebreaker = false;

                            if (isFinal) {
                                if (t1Wins > t2Wins) {
                                    t1IsWinner = true;
                                } else if (t2Wins > t1Wins) {
                                    t2IsWinner = true;
                                } else {
                                    wonByTiebreaker = true;
                                    if (g.t1Pts !== null && g.t2Pts !== null && g.t1Pts > g.t2Pts) {
                                        t1IsWinner = true;
                                    } else if (g.t1Pts !== null && g.t2Pts !== null && g.t2Pts > g.t1Pts) {
                                        t2IsWinner = true;
                                    }
                                }
                            }

                            const t1SeriesDisplay = isFinal ? t1Wins : '--';
                            const t2SeriesDisplay = isFinal ? t2Wins : '--';

                            let statusLabel = 'Scheduled';
                            if (isFinal) {
                                if (wonByTiebreaker && (t1IsWinner || t2IsWinner)) {
                                    const tbTeam = t1IsWinner ? g.team1 : g.team2;
                                    statusLabel = `Final &bull; ${tbTeam} won (TB)`;
                                } else if (t1IsWinner || t2IsWinner) {
                                    const wTeam = t1IsWinner ? g.team1 : g.team2;
                                    statusLabel = `Final &bull; ${wTeam} won`;
                                } else {
                                    statusLabel = 'Final (Tie)';
                                }
                            } else if (isToday) {
                                statusLabel = 'Live Today';

                                        </div>

                                    </div>
                                    <div class="brief-team-row">
                                        <div class="brief-team-info">
                                            <img src="${getTeamLogoPath(g.team2)}" class="team-logo" onerror="this.style.display='none'">

            `;
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            const todayStr = getTodayDateEST();

            let filteredSlates = allSlates.filter(slate => {
                if (currentTypeFilter === 'preseason' && !slate.isPreseason) return false;
                if (currentTypeFilter === 'regular' && (slate.isPlayoff || slate.isPreseason)) return false;
                if (currentTypeFilter === 'playoffs' && !slate.isPlayoff) return false;
                return true;
            });

            if (currentTeamFilter !== 'ALL') {
                filteredSlates = filteredSlates.map(slate => {
                    return {
                        ...slate,
                        games: slate.games.filter(g => g.team1 === currentTeamFilter || g.team2 === currentTeamFilter)
                    };
                }).filter(slate => slate.games.length > 0);
            }

            if (filteredSlates.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:3rem; color:#888;">No games found matching the selected filters.</div>';
                return;
            }

            // If viewing Playoffs or All Games with playoff slates, group by Round series
            if (currentTypeFilter === 'playoffs') {
                const roundOrder = ['Wild Card', 'Conference Finals', 'Finals'];
                const roundGroups = {};

                filteredSlates.forEach(s => {
                    const r = s.playoffRound || 'Wild Card';
                    if (!roundGroups[r]) roundGroups[r] = [];
                    roundGroups[r].push(s);
                });

                let html = '';
                roundOrder.forEach(rName => {
                    const slatesInRound = roundGroups[rName];
                    if (slatesInRound && slatesInRound.length > 0) {
                        html += `
                            <div class="round-group-section">
                                <div class="round-group-header">
                                    <div class="round-group-title">${rName}</div>
                                    <span class="round-group-badge">${slatesInRound.length} Gameday Slates</span>
                                </div>
                                ${slatesInRound.map(slate => renderSlateCardHtml(slate, todayStr)).join('')}
                            </div>
                        `;
                    }
                });

                // Fallback for any rounds with custom names
                Object.keys(roundGroups).forEach(rName => {
                    if (!roundOrder.includes(rName)) {
                        const slatesInRound = roundGroups[rName];
                        html += `
                            <div class="round-group-section">
                                <div class="round-group-header">
                                    <div class="round-group-title">${rName}</div>
                                    <span class="round-group-badge">${slatesInRound.length} Gameday Slates</span>
                                </div>
                                ${slatesInRound.map(slate => renderSlateCardHtml(slate, todayStr)).join('')}
                            </div>
                        `;
                    }
                });

                container.innerHTML = html;
                return;
            }

            // Standard layout for Regular Season or All Games
            container.innerHTML = filteredSlates.map(slate => renderSlateCardHtml(slate, todayStr)).join('');
        }

        init();
    </script>
    <!-- Game Detail Modal for Breakdown -->
    <div class="game-detail-modal-bg" id="game-detail-modal">
        <div class="game-detail-modal">
            <button class="game-detail-close" onclick="closeGameModal()">&times;</button>
            <div id="game-detail-content"></div>
        </div>
    </div>
</body>
</html>
