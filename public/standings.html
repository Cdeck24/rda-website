<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDA Standings & Playoff Picture</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles/global-v2.css">
    <style>
        .standings-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 1rem 4rem 1rem;
            box-sizing: border-box;
            animation: fadeIn 0.4s ease-out;
        }

        /* View Toggle Tabs */
        .sub-nav-container {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .sub-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            padding: 0.45rem 1.1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sub-nav-btn:hover { color: #fff; }
        .sub-nav-btn.active { color: var(--gold-light); border-bottom: 2px solid var(--gold-mid); }

        /* Headers */
        .conf-header {
            font-size: 1.35rem;
            margin: 2rem 0 0.75rem 0;
            color: #fff;
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 0.4rem;
            font-family: 'Didot', serif;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .conf-header:first-of-type { margin-top: 0.5rem; }

        .div-header {
            font-size: 0.85rem;
            color: var(--gold-mid);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 1.25rem 0 0.5rem 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Table Scaffolding */
        .table-wrapper {
            overflow-x: auto;
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: rgba(15, 23, 42, 0.5);
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        .data-table th, .data-table td {
            padding: 0.75rem 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.85rem;
        }

        .data-table th {
            background: rgba(0, 0, 0, 0.3);
            color: var(--gold-mid);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .data-table tbody tr { transition: background 0.15s ease; }
        .data-table tbody tr:hover { background: rgba(255, 255, 255, 0.03); }

        .team-cell-link {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
        .team-cell-link:hover { color: var(--gold-light); }

        .team-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .seed-cell {
            width: 40px;
            text-align: center;
            font-weight: 800;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .seed-playoff { color: var(--gold-light); }

        .cutline-row td {
            border-bottom: 2px dashed rgba(212, 175, 55, 0.4) !important;
        }

        .div-winner-badge {
            font-size: 0.55rem;
            padding: 1px 4px;
            border-radius: 3px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: var(--gold-mid);
            margin-left: 6px;
            font-weight: 800;
        }

        .stat-val { text-align: right; font-variant-numeric: tabular-nums; }
        .stat-win { color: #4ade80; font-weight: 700; }
        .stat-loss { color: #f87171; font-weight: 700; }
        .stat-diff-pos { color: #4ade80; font-weight: 600; }
        .stat-diff-neg { color: #f87171; font-weight: 600; }

        /* Bracket Tree Diagram Styling */
        .bracket-tree-outer {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        .bracket-banner {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .bracket-banner-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Didot', serif;
            letter-spacing: 0.5px;
        }

        .bracket-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-live-picture {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .badge-final-bracket {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold-mid);
            border: 1px solid var(--border-gold);
        }

        .bracket-scroll-hint {
            display: none;
            text-align: center;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--gold-mid);
            text-transform: uppercase;
            letter-spacing: 0.75px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 0.4rem;
            border-radius: 6px;
        }
        @media (max-width: 900px) {
            .bracket-scroll-hint { display: block; }
        }

        .bracket-scroll-viewport {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            padding: 1rem 0.5rem 2rem 0.5rem;
            box-sizing: border-box;
            background: rgba(10, 15, 29, 0.6);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .bracket-scroll-viewport::-webkit-scrollbar { height: 6px; }
        .bracket-scroll-viewport::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .bracket-scroll-viewport::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.35); border-radius: 3px; }

        .bracket-tree-grid {
            display: flex;
            min-width: 900px;
            align-items: stretch;
            justify-content: space-between;
            gap: 0;
            position: relative;
        }

        .bracket-stage-col {
            display: flex;
            flex-direction: column;
            width: 240px;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .bracket-stage-col.finals-stage { width: 260px; }

        .bracket-stage-header {
            text-align: center;
            padding-bottom: 0.6rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-gold);
        }
        .stage-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--gold-mid);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }
        .stage-subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        .bracket-stage-body {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            flex: 1;
            gap: 1.25rem;
        }

        .bracket-connector-col {
            width: 50px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding-top: 48px;
            box-sizing: border-box;
        }

        .connector-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .bracket-match-node {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
            position: relative;
        }
        .bracket-match-node:hover {
            border-color: rgba(212, 175, 55, 0.6);
            transform: translateY(-1px);
        }

        .bracket-match-node.championship-node {
            border-color: var(--border-gold);
            background: linear-gradient(180deg, rgba(45, 55, 72, 0.95) 0%, rgba(20, 26, 46, 1) 100%);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
        }

        .match-node-header {
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            font-size: 0.62rem;
            font-weight: 800;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .match-team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.15s ease;
        }
        .match-team-row:last-child { border-bottom: none; }
        .match-team-row.winner {
            background: rgba(212, 175, 55, 0.08);
        }

        .match-team-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }

        .match-seed-badge {
            font-size: 0.6rem;
            font-weight: 900;
            color: var(--gold-mid);
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 3px;
            padding: 1px 4px;
            min-width: 14px;
            text-align: center;
            flex-shrink: 0;
        }

        .match-team-logo {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .match-team-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .match-team-name.placeholder {
            color: #94a3b8;
            font-style: italic;
        }
        .match-team-row.winner .match-team-name {
            color: #fff;
            font-weight: 900;
        }

        .match-team-score {
            font-size: 0.95rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
            margin-left: 6px;
        }
        .match-team-row.winner .match-team-score {
            color: var(--gold-mid);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        .trophy-badge {
            font-size: 0.6rem;
            color: var(--gold-light);
            font-weight: 900;
            margin-left: 4px;
        }

        @media (max-width: 650px) {
            .standings-content { padding: 0.5rem 0.5rem 3rem 0.5rem; }
            .conf-header { font-size: 1.15rem; }
            .data-table th, .data-table td { padding: 0.6rem 0.45rem; font-size: 0.78rem; }
            .team-logo { width: 20px; height: 20px; }
            .col-hide-mobile { display: none; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <h1>RDA Standings</h1>

    <div class="sub-nav-container">
        <button class="sub-nav-btn active" id="tab-conference" onclick="switchView('conference')">Conference</button>
        <button class="sub-nav-btn" id="tab-division" onclick="switchView('division')">Division</button>
        <button class="sub-nav-btn" id="tab-bracket" onclick="switchView('bracket')">Playoff Bracket</button>
    </div>

    <div class="standings-content" id="standings-container">
        <div style="text-align: center; color: var(--gold-mid); padding: 3rem; font-style: italic;">Loading standings...</div>
    </div>

    <script type="module">
        import { initNav, getSeasonData, currentSeason, getTeamLogoPath } from './js/app.js?v=7';
        initNav();

        const seasonConfigs = {
            '4': {
                'Dragons': { conf: 'East Conference', div: 'Atlantic Division' },
                'Bajas': { conf: 'East Conference', div: 'Atlantic Division' },
                'Buffaloes': { conf: 'East Conference', div: 'Atlantic Division' },
                'Kings': { conf: 'East Conference', div: 'Metro Division' },
                'Underdogs': { conf: 'East Conference', div: 'Metro Division' },
                'Knights': { conf: 'East Conference', div: 'Metro Division' },
                'Reapers': { conf: 'West Conference', div: 'Central Division' },
                'Stars': { conf: 'West Conference', div: 'Central Division' },
                'Zombies': { conf: 'West Conference', div: 'Central Division' },
                'Manatees': { conf: 'West Conference', div: 'Pacific Division' },
                'Tigers': { conf: 'West Conference', div: 'Pacific Division' },
                'Voyagers': { conf: 'West Conference', div: 'Pacific Division' }
            },
            '5': {
                'Dragons': { conf: 'East Conference', div: 'Atlantic Division' },
                'Bajas': { conf: 'East Conference', div: 'Atlantic Division' },
                'Buffaloes': { conf: 'East Conference', div: 'Atlantic Division' },
                'Kings': { conf: 'East Conference', div: 'Metro Division' },
                'Underdogs': { conf: 'East Conference', div: 'Metro Division' },
                'Knights': { conf: 'East Conference', div: 'Metro Division' },
                'Reapers': { conf: 'West Conference', div: 'Central Division' },
                'Stars': { conf: 'West Conference', div: 'Central Division' },
                'Zombies': { conf: 'West Conference', div: 'Central Division' },
                'Manatees': { conf: 'West Conference', div: 'Pacific Division' },
                'Tigers': { conf: 'West Conference', div: 'Pacific Division' },
                'Voyagers': { conf: 'West Conference', div: 'Pacific Division' }
            },
            '6': {
                'Reapers': { conf: 'East Conference', div: 'Atlantic Division' },
                'Knights': { conf: 'East Conference', div: 'Atlantic Division' },
                'Voyagers': { conf: 'East Conference', div: 'Atlantic Division' },
                'Bajas': { conf: 'East Conference', div: 'Metro Division' },
                'Manatees': { conf: 'East Conference', div: 'Metro Division' },
                'Saucers': { conf: 'East Conference', div: 'Metro Division' },
                'Dragons': { conf: 'West Conference', div: 'Central Division' },
                'Tigers': { conf: 'West Conference', div: 'Central Division' },
                'Zombies': { conf: 'West Conference', div: 'Central Division' },
                'Underdogs': { conf: 'West Conference', div: 'Pacific Division' },
                'Kings': { conf: 'West Conference', div: 'Pacific Division' },
                'Buffaloes': { conf: 'West Conference', div: 'Pacific Division' }
            }
        };

        const historicalTrophies = {
            '1': { first: 'Manatees', second: 'Stars', third: 'Kings' },
            '2': { first: 'Kings', second: 'Stars', third: 'Underdogs' },
            '3': { first: 'Kings', second: 'Bajas', third: 'Dragons' },
            '4': { first: 'Reapers', second: 'Underdogs', third: 'Kings' },
            '5': { first: 'Dragons', second: 'Reapers', third: 'Bajas' },
            '6': { first: 'TBD', second: 'TBD', third: 'TBD' }
        };

        let globalTeams = [];
        let playoffGames = [];
        let currentView = 'conference';

        const sortTeams = (a, b) => {
            if (b.pct !== a.pct) return b.pct - a.pct;
            if (b.wins !== a.wins) return b.wins - a.wins;
            if (b.diff !== a.diff) return b.diff - a.diff;
            return (b.pointsFor || 0) - (a.pointsFor || 0);
        };

        window.switchView = (view) => {
            currentView = view;
            document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${view}`).classList.add('active');
            render();
        };

        async function init() {
            const [teamsRaw, gamesRaw, pGamesRaw] = await Promise.all([
                getSeasonData('teams'),
                getSeasonData('games'),
                getSeasonData('playoff-games')
            ]);

            playoffGames = pGamesRaw || [];
            const config = seasonConfigs[currentSeason] || seasonConfigs['6'];

            let calculatedTeams = teamsRaw;
            if (!calculatedTeams || !calculatedTeams.length) {
                const calculated = {};
                Object.keys(config).forEach(t => {
                    calculated[t] = { name: t, wins: 0, losses: 0, pointsFor: 0, pointsAgainst: 0 };
                });

                if (gamesRaw && gamesRaw.length) {
                    gamesRaw.forEach(g => {
                        const t1 = g.team1 || g['team 1'], t2 = g.team2 || g['team 2'];
                        const s1 = parseFloat(g.team1score) || 0;
                        const s2 = parseFloat(g.team2score) || 0;
                        const winner = g.winner;

                        if (calculated[t1]) {
                            calculated[t1].pointsFor += s1;
                            calculated[t1].pointsAgainst += s2;
                            if (winner === t1) calculated[t1].wins++;
                            else if (winner === t2) calculated[t1].losses++;
                        }
                        if (calculated[t2]) {
                            calculated[t2].pointsFor += s2;
                            calculated[t2].pointsAgainst += s1;
                            if (winner === t2) calculated[t2].wins++;
                            else if (winner === t1) calculated[t2].losses++;
                        }
                    });
                }
                calculatedTeams = Object.values(calculated);
            }

            globalTeams = calculatedTeams.filter(t => t && t.name && t.name !== 'TIE' && !t.name.toLowerCase().includes('free agent')).map(t => {
                const wins = parseInt(t.wins) || 0;
                const losses = parseInt(t.losses) || 0;
                const pf = parseFloat(t.pointsFor) || 0;
                const pa = parseFloat(t.pointsAgainst) || 0;
                const gp = wins + losses;
                return {
                    name: t.name,
                    wins, losses, gp,
                    pointsFor: pf, pointsAgainst: pa,
                    pct: gp > 0 ? wins / gp : 0,
                    diff: pf - pa
                };
            });

            render();
        }

        function getSeededConferenceTeams(confName, structure) {
            const divObj = structure[confName] || {};
            const divisionWinners = [];
            const wildcards = [];

            Object.keys(divObj).forEach(divName => {
                const sortedDiv = [...divObj[divName]].sort(sortTeams);
                if (sortedDiv.length > 0) {
                    divisionWinners.push({ ...sortedDiv[0], isDivWinner: true });
                    wildcards.push(...sortedDiv.slice(1).map(x => ({ ...x, isDivWinner: false })));
                }
            });

            divisionWinners.sort(sortTeams);
            wildcards.sort(sortTeams);
            return [...divisionWinners, ...wildcards];
        }

        function render() {
            const container = document.getElementById('standings-container');
            const config = seasonConfigs[currentSeason] || seasonConfigs['6'];

            const structure = {};
            globalTeams.forEach(t => {
                const map = config[t.name];
                if (!map) return;
                if (!structure[map.conf]) structure[map.conf] = {};
                if (!structure[map.conf][map.div]) structure[map.conf][map.div] = [];
                structure[map.conf][map.div].push(t);
            });

            const confs = Object.keys(structure).sort();
            let html = '';

            if (currentView === 'conference') {
                confs.forEach(confName => {
                    const seededTeams = getSeededConferenceTeams(confName, structure);
                    html += `
                        <div class="conf-header">
                            <span>${confName}</span>
                            <span style="font-size:0.65rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; font-family:sans-serif; font-weight:700;">Top 4 Qualify</span>
                        </div>
                        <div class="table-wrapper">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th class="seed-cell">Seed</th>
                                        <th>Franchise</th>
                                        <th class="stat-val">W</th>
                                        <th class="stat-val">L</th>
                                        <th class="stat-val">Pct</th>
                                        <th class="stat-val col-hide-mobile">PF</th>
                                        <th class="stat-val col-hide-mobile">PA</th>
                                        <th class="stat-val">Diff</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${seededTeams.map((t, idx) => createRow(t, idx + 1, idx === 3)).join('')}
                                </tbody>
                            </table>
                        </div>`;
                });
            } else if (currentView === 'division') {
                confs.forEach(confName => {
                    html += `<div class="conf-header">${confName}</div>`;
                    const divs = Object.keys(structure[confName]).sort();

                    divs.forEach(divName => {
                        const divTeams = [...structure[confName][divName]].sort(sortTeams);
                        html += `
                            <div class="div-header">${divName}</div>
                            <div class="table-wrapper">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Franchise</th>
                                            <th class="stat-val">W</th>
                                            <th class="stat-val">L</th>
                                            <th class="stat-val">Pct</th>
                                            <th class="stat-val col-hide-mobile">PF</th>
                                            <th class="stat-val col-hide-mobile">PA</th>
                                            <th class="stat-val">Diff</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${divTeams.map((t, idx) => createRow(t, null, false, idx === 0)).join('')}
                                    </tbody>
                                </table>
                            </div>`;
                    });
                });
            } else if (currentView === 'bracket') {
                html = renderPlayoffBracketView(structure);
            }

            container.innerHTML = html;
        }

        function renderPlayoffBracketView(structure) {
            const eastTeams = getSeededConferenceTeams('East Conference', structure);
            const westTeams = getSeededConferenceTeams('West Conference', structure);
            const trophy = historicalTrophies[currentSeason];
            const isHistoricalCompleted = (currentSeason !== '6' && trophy && trophy.first !== 'TBD');

            const e1 = eastTeams[0] || { name: 'TBD' }, e4 = eastTeams[3] || { name: 'TBD' };
            const e2 = eastTeams[1] || { name: 'TBD' }, e3 = eastTeams[2] || { name: 'TBD' };
            const w1 = westTeams[0] || { name: 'TBD' }, w4 = westTeams[3] || { name: 'TBD' };
            const w2 = westTeams[1] || { name: 'TBD' }, w3 = westTeams[2] || { name: 'TBD' };

            // Aggregate series wins from played playoff games
            const seriesMap = {};
            (playoffGames || []).forEach(g => {
                const t1 = (g.team1 || g['team 1'] || g.away || '').trim();
                const t2 = (g.team2 || g['team 2'] || g.home || '').trim();
                if (!t1 || !t2 || t1 === 'TBD' || t2 === 'TBD') return;

                const pairKey = [t1.toLowerCase(), t2.toLowerCase()].sort().join('__VS__');
                if (!seriesMap[pairKey]) {
                    seriesMap[pairKey] = { teamA: t1, teamB: t2, winsA: 0, winsB: 0, games: 0 };
                }
                const s = seriesMap[pairKey];
                const w = (g.winner || '').trim().toLowerCase();
                s.games++;

                if (s.teamA.toLowerCase() === t1.toLowerCase()) {
                    if (w === t1.toLowerCase()) s.winsA++;
                    else if (w === t2.toLowerCase()) s.winsB++;
                } else {
                    if (w === t1.toLowerCase()) s.winsB++;
                    else if (w === t2.toLowerCase()) s.winsA++;
                }
            });

            function resolveMatch(label, teamA, seedA, teamB, seedB, targetWins, isChamp = false) {
                const isPlaceholderA = !teamA || teamA === 'TBD' || teamA.startsWith('Winner') || teamA.includes('Champion') || teamA.includes('Runner-Up');
                const isPlaceholderB = !teamB || teamB === 'TBD' || teamB.startsWith('Winner') || teamB.includes('Champion') || teamB.includes('Runner-Up');

                if (isPlaceholderA || isPlaceholderB) {
                    return {
                        label,
                        teamA: teamA || 'TBD', seedA, scoreA: '--', isWinA: false,
                        teamB: teamB || 'TBD', seedB, scoreB: '--', isWinB: false,
                        winner: null, loser: null,
                        status: `Best of ${targetWins === 2 ? 3 : (targetWins === 3 ? 5 : 7)}`,
                        isComplete: false, isChamp
                    };
                }

                const pairKey = [teamA.toLowerCase(), teamB.toLowerCase()].sort().join('__VS__');
                const s = seriesMap[pairKey];

                if (!s || s.games === 0) {
                    return {
                        label,
                        teamA, seedA, scoreA: '--', isWinA: false,
                        teamB, seedB, scoreB: '--', isWinB: false,
                        winner: null, loser: null,
                        status: `Best of ${targetWins === 2 ? 3 : (targetWins === 3 ? 5 : 7)}`,
                        isComplete: false, isChamp
                    };
                }

                const isTeamAFirst = (s.teamA.toLowerCase() === teamA.toLowerCase());
                const winsA = isTeamAFirst ? s.winsA : s.winsB;
                const winsB = isTeamAFirst ? s.winsB : s.winsA;

                const isWinA = winsA >= targetWins;
                const isWinB = winsB >= targetWins;
                const isComplete = isWinA || isWinB;

                return {
                    label,
                    teamA, seedA, scoreA: winsA, isWinA,
                    teamB, seedB, scoreB: winsB, isWinB,
                    winner: isWinA ? teamA : (isWinB ? teamB : null),
                    loser: isWinA ? teamB : (isWinB ? teamA : null),
                    status: isComplete ? `FINAL (${Math.max(winsA, winsB)}-${Math.min(winsA, winsB)})` : `IN PROGRESS (${winsA}-${winsB})`,
                    isComplete, isChamp
                };
            }

            let m_e1, m_e2, m_w1, m_w2, m_eastFinal, m_westFinal, m_champ, m_third;

            if (isHistoricalCompleted) {
                const completedSeries = Object.values(seriesMap).map(s => ({
                    ...s,
                    winner: s.winsA > s.winsB ? s.teamA : s.teamB
                }));

                const configSeason = seasonConfigs[currentSeason] || seasonConfigs['6'];
                const getConf = (name) => configSeason[name]?.conf || '';

                const eastSemis = [], westSemis = [];
                completedSeries.forEach(s => {
                    const confA = getConf(s.teamA);
                    const confB = getConf(s.teamB);
                    const isInterConf = confA !== confB || (!confA && !confB);

                    if (isInterConf) {
                        if (trophy && trophy.third && (s.teamA === trophy.third || s.teamB === trophy.third)) m_third = s;
                        else if (!m_champ) m_champ = s;
                        else m_third = s;
                    } else if (confA === 'East Conference') {
                        if (trophy && (s.winner === trophy.first || s.winner === trophy.second) && !m_eastFinal) m_eastFinal = s;
                        else if (eastSemis.length < 2) eastSemis.push(s);
                        else m_eastFinal = s;
                    } else if (confA === 'West Conference') {
                        if (trophy && (s.winner === trophy.first || s.winner === trophy.second) && !m_westFinal) m_westFinal = s;
                        else if (westSemis.length < 2) westSemis.push(s);
                        else m_westFinal = s;
                    }
                });

                const champT1 = trophy?.first || 'Champion';
                const champT2 = trophy?.second || 'Runner-Up';
                const thirdT1 = trophy?.third || '3rd Place';
                const thirdT2 = m_third ? (m_third.winner === m_third.teamA ? m_third.teamB : m_third.teamA) : '4th Place';

                m_e1 = createHistoricalModel('East Semifinal 1', eastSemis[0] || { teamA: e1.name, teamB: e4.name, winner: e1.name, winsA: 2, winsB: 0 }, 1, 4, 2);
                m_e2 = createHistoricalModel('East Semifinal 2', eastSemis[1] || { teamA: e2.name, teamB: e3.name, winner: e2.name, winsA: 2, winsB: 1 }, 2, 3, 2);
                m_w1 = createHistoricalModel('West Semifinal 1', westSemis[0] || { teamA: w1.name, teamB: w4.name, winner: w1.name, winsA: 2, winsB: 0 }, 1, 4, 2);
                m_w2 = createHistoricalModel('West Semifinal 2', westSemis[1] || { teamA: w2.name, teamB: w3.name, winner: w2.name, winsA: 2, winsB: 1 }, 2, 3, 2);

                m_eastFinal = createHistoricalModel('East Finals', m_eastFinal || { teamA: m_e1.winner, teamB: m_e2.winner, winner: champT1, winsA: 3, winsB: 1 }, null, null, 3);
                m_westFinal = createHistoricalModel('West Finals', m_westFinal || { teamA: m_w1.winner, teamB: m_w2.winner, winner: champT2, winsA: 3, winsB: 2 }, null, null, 3);

                m_champ = createHistoricalModel('Championship Finals', m_champ || { teamA: champT1, teamB: champT2, winner: champT1, winsA: 4, winsB: 2 }, null, null, 4, true);
                m_third = createHistoricalModel('Third-Place Match', m_third || { teamA: thirdT1, teamB: thirdT2, winner: thirdT1, winsA: 4, winsB: 1 }, null, null, 4);
            } else {
                // Round 1: Semifinals (Best of 3 - Target: 2 wins)
                m_e1 = resolveMatch('East Semifinal 1', e1.name, 1, e4.name, 4, 2);
                m_e2 = resolveMatch('East Semifinal 2', e2.name, 2, e3.name, 3, 2);
                m_w1 = resolveMatch('West Semifinal 1', w1.name, 1, w4.name, 4, 2);
                m_w2 = resolveMatch('West Semifinal 2', w2.name, 2, w3.name, 3, 2);

                // Round 2: Conference Finals (Best of 5 - Target: 3 wins)
                const eastFinalTeamA = m_e1.isComplete ? m_e1.winner : 'Winner Semi 1';
                const eastFinalSeedA = m_e1.isComplete ? (m_e1.winner === m_e1.teamA ? m_e1.seedA : m_e1.seedB) : null;
                const eastFinalTeamB = m_e2.isComplete ? m_e2.winner : 'Winner Semi 2';
                const eastFinalSeedB = m_e2.isComplete ? (m_e2.winner === m_e2.teamA ? m_e2.seedA : m_e2.seedB) : null;
                m_eastFinal = resolveMatch('East Finals', eastFinalTeamA, eastFinalSeedA, eastFinalTeamB, eastFinalSeedB, 3);

                const westFinalTeamA = m_w1.isComplete ? m_w1.winner : 'Winner Semi 1';
                const westFinalSeedA = m_w1.isComplete ? (m_w1.winner === m_w1.teamA ? m_w1.seedA : m_w1.seedB) : null;
                const westFinalTeamB = m_w2.isComplete ? m_w2.winner : 'Winner Semi 2';
                const westFinalSeedB = m_w2.isComplete ? (m_w2.winner === m_w2.teamA ? m_w2.seedA : m_w2.seedB) : null;
                m_westFinal = resolveMatch('West Finals', westFinalTeamA, westFinalSeedA, westFinalTeamB, westFinalSeedB, 3);

                // Round 3: Finals (Best of 7 - Target: 4 wins)
                const champTeamA = m_eastFinal.isComplete ? m_eastFinal.winner : 'East Champion';
                const champTeamB = m_westFinal.isComplete ? m_westFinal.winner : 'West Champion';
                m_champ = resolveMatch('Championship Finals', champTeamA, null, champTeamB, null, 4, true);

                const thirdTeamA = m_eastFinal.isComplete ? m_eastFinal.loser : 'East Runner-Up';
                const thirdTeamB = m_westFinal.isComplete ? m_westFinal.loser : 'West Runner-Up';
                m_third = resolveMatch('Third-Place Match', thirdTeamA, null, thirdTeamB, null, 4);
            }

            const isTournamentFinished = isHistoricalCompleted || (m_champ && m_champ.isComplete);

            return `
                <div class="bracket-tree-outer">
                    <div class="bracket-banner">
                        <div>
                            <div class="bracket-banner-title">
                                <span>${isTournamentFinished ? '🏆 Official Tournament Bracket' : `🏆 Season ${currentSeason} Playoff Bracket`}</span>
                                <span class="bracket-badge ${isTournamentFinished ? 'badge-final-bracket' : 'badge-live-picture'}">
                                    ${isTournamentFinished ? 'Completed' : 'In Progress'}
                                </span>
                            </div>
                            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">
                                Semis: Best of 3 &bull; Conf Finals: Best of 5 &bull; Finals: Best of 7
                            </div>
                        </div>
                    </div>

                    <div class="bracket-scroll-hint">↔ Swipe horizontally to trace the playoff path</div>

                    <div class="bracket-scroll-viewport">
                        <div class="bracket-tree-grid">
                            
                            <!-- COLUMN 1: SEMIFINALS (BO3) -->
                            <div class="bracket-stage-col">
                                <div class="bracket-stage-header">
                                    <div class="stage-title">Conference Semis</div>
                                    <div class="stage-subtitle">Best of 3 &bull; First to 2</div>
                                </div>
                                <div class="bracket-stage-body">
                                    ${renderNodeCard(m_e1)}
                                    ${renderNodeCard(m_e2)}
                                    ${renderNodeCard(m_w1)}
                                    ${renderNodeCard(m_w2)}
                                </div>
                            </div>

                            <!-- CONNECTOR: SEMIS TO CONF FINALS -->
                            <div class="bracket-connector-col">
                                <div style="flex: 1; display: flex; align-items: center;">
                                    <svg class="connector-svg" viewBox="0 0 50 100" preserveAspectRatio="none">
                                        <path d="M 0 25 H 25 V 75 H 0 M 25 50 H 50" stroke="rgba(212,175,55,0.75)" stroke-width="2" vector-effect="non-scaling-stroke" fill="none"/>
                                    </svg>
                                </div>
                                <div style="flex: 1; display: flex; align-items: center;">
                                    <svg class="connector-svg" viewBox="0 0 50 100" preserveAspectRatio="none">
                                        <path d="M 0 25 H 25 V 75 H 0 M 25 50 H 50" stroke="rgba(212,175,55,0.75)" stroke-width="2" vector-effect="non-scaling-stroke" fill="none"/>
                                    </svg>
                                </div>
                            </div>

                            <!-- COLUMN 2: CONFERENCE FINALS (BO5) -->
                            <div class="bracket-stage-col">
                                <div class="bracket-stage-header">
                                    <div class="stage-title">Conference Finals</div>
                                    <div class="stage-subtitle">Best of 5 &bull; First to 3</div>
                                </div>
                                <div class="bracket-stage-body">
                                    ${renderNodeCard(m_eastFinal)}
                                    ${renderNodeCard(m_westFinal)}
                                </div>
                            </div>

                            <!-- CONNECTOR: CONF FINALS TO CHAMPIONSHIP -->
                            <div class="bracket-connector-col">
                                <div style="flex: 1; display: flex; align-items: center;">
                                    <svg class="connector-svg" viewBox="0 0 50 100" preserveAspectRatio="none">
                                        <path d="M 0 25 H 25 V 75 H 0 M 25 50 H 50" stroke="rgba(212,175,55,0.9)" stroke-width="2" vector-effect="non-scaling-stroke" fill="none"/>
                                    </svg>
                                </div>
                            </div>

                            <!-- COLUMN 3: FINALS (BO7) -->
                            <div class="bracket-stage-col finals-stage">
                                <div class="bracket-stage-header">
                                    <div class="stage-title">RDA Championship</div>
                                    <div class="stage-subtitle">Best of 7 &bull; First to 4</div>
                                </div>
                                <div class="bracket-stage-body">
                                    ${renderNodeCard(m_champ, true)}
                                    ${renderNodeCard(m_third, false, true)}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            `;
        }

        function createHistoricalModel(label, series, seedA, seedB, targetWins, isChamp = false) {
            const isWinA = series.winner === series.teamA;
            const isWinB = series.winner === series.teamB;
            const scoreA = series.winsA || (isWinA ? targetWins : 0);
            const scoreB = series.winsB || (isWinB ? targetWins : 0);
            return {
                label,
                teamA: series.teamA, seedA, scoreA, isWinA,
                teamB: series.teamB, seedB, scoreB, isWinB,
                winner: series.winner,
                status: `Final (${Math.max(scoreA, scoreB)}-${Math.min(scoreA, scoreB)})`,
                isChamp
            };
        }

        function renderNodeCard(m, isFinals = false, isThird = false) {
            if (!m) return '';
            const champClass = isFinals ? 'championship-node' : '';
            const isPlaceholderA = m.teamA.startsWith('Winner') || m.teamA.includes('Champion') || m.teamA.includes('Runner-Up') || m.teamA === 'TBD';
            const isPlaceholderB = m.teamB.startsWith('Winner') || m.teamB.includes('Champion') || m.teamB.includes('Runner-Up') || m.teamB === 'TBD';

            return `
                <div class="bracket-match-node ${champClass}">
                    <div class="match-node-header">
                        <span>${isFinals ? '🏆 ' : (isThird ? '🥉 ' : '')}${m.label}</span>
                        <span>${m.status}</span>
                    </div>
                    <div class="match-team-row ${m.isWinA ? 'winner' : ''}">
                        <div class="match-team-left">
                            ${m.seedA ? `<span class="match-seed-badge">#${m.seedA}</span>` : ''}
                            <img src="${getTeamLogoPath(m.teamA)}" class="match-team-logo" onerror="this.style.display='none'">
                            <span class="match-team-name ${isPlaceholderA ? 'placeholder' : ''}">${m.teamA}</span>
                            ${m.isWinA && isFinals ? '<span class="trophy-badge">👑 Champ</span>' : ''}
                        </div>
                        <span class="match-team-score">${m.scoreA}</span>
                    </div>
                    <div class="match-team-row ${m.isWinB ? 'winner' : ''}">
                        <div class="match-team-left">
                            ${m.seedB ? `<span class="match-seed-badge">#${m.seedB}</span>` : ''}
                            <img src="${getTeamLogoPath(m.teamB)}" class="match-team-logo" onerror="this.style.display='none'">
                            <span class="match-team-name ${isPlaceholderB ? 'placeholder' : ''}">${m.teamB}</span>
                            ${m.isWinB && isFinals ? '<span class="trophy-badge">👑 Champ</span>' : ''}
                        </div>
                        <span class="match-team-score">${m.scoreB}</span>
                    </div>
                </div>
            `;
        }

        function createRow(t, seed = null, isCutline = false, isDivLeader = false) {
            const isPlayoffSeed = seed && seed <= 4;
            const diffClass = t.diff > 0 ? 'stat-diff-pos' : (t.diff < 0 ? 'stat-diff-neg' : '');
            const diffSign = t.diff > 0 ? '+' : '';

            return `
                <tr class="${isCutline ? 'cutline-row' : ''}">
                    ${seed ? `<td class="seed-cell ${isPlayoffSeed ? 'seed-playoff' : ''}">${seed}</td>` : ''}
                    <td>
                        <a href="teams.html?season=${currentSeason}&team=${encodeURIComponent(t.name)}" class="team-cell-link">
                            <img src="${getTeamLogoPath(t.name)}" class="team-logo" onerror="this.style.display='none'">
                            <span>${t.name}</span>
                            ${t.isDivWinner || isDivLeader ? '<span class="div-winner-badge">DIV</span>' : ''}
                        </a>
                    </td>
                    <td class="stat-val stat-win">${t.wins}</td>
                    <td class="stat-val stat-loss">${t.losses}</td>
                    <td class="stat-val">${t.pct.toFixed(3)}</td>
                    <td class="stat-val col-hide-mobile" style="color:#cbd5e1;">${t.pointsFor.toFixed(1)}</td>
                    <td class="stat-val col-hide-mobile" style="color:#cbd5e1;">${t.pointsAgainst.toFixed(1)}</td>
                    <td class="stat-val ${diffClass}">${diffSign}${t.diff.toFixed(1)}</td>
                </tr>`;
        }

        init();
    </script>
</body>
</html>
