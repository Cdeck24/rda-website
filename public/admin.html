<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDA Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles/global.css">
    <!-- Required for Hashids Token Generation -->
    <script src="https://cdn.jsdelivr.net/npm/hashids@2.2.10/dist/hashids.min.js"></script>
    <style>
        .admin-container {
            max-width: 800px;
            margin: 2rem auto;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 2rem;
            text-align: left;
        }

        .auth-status {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--gold-light);
            font-weight: bold;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            max-width: 100%;
            padding: 0.8rem;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-subtle);
            color: #fff;
            border-radius: 6px;
            font-size: 1rem;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: var(--gold-mid);
            outline: none;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn-group button {
            flex: 1;
            min-width: 200px;
        }

        #output {
            background: #000;
            color: #4ade80;
            padding: 1.5rem;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            margin-top: 2rem;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-subtle);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        #login-container {
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Navigation (Injected via JS) -->

    <h1 style="margin-top: 2rem; font-size: 2.5rem; text-align: center;">Admin Panel</h1>
    
    <div class="admin-container">
        
        <!-- Easy Navigation Links -->
        <div style="text-align: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-subtle);">
            <a href="index.html" style="color: var(--gold-mid); text-decoration: none; font-weight: bold; margin-right: 1.5rem;">&larr; League Selection</a>
            <span style="color: var(--text-muted);">|</span>
            <a href="hub.html" style="color: var(--gold-mid); text-decoration: none; font-weight: bold; margin-left: 1.5rem;">Hub &rarr;</a>
        </div>
        
        <!-- Auth Section -->
        <div class="auth-status">
            <div id="user-display" style="color: var(--text-muted); margin-bottom: 1rem;">Checking authentication...</div>
            
            <div id="login-container" class="hidden">
                <input type="email" id="login-email" placeholder="Admin Email" style="margin-bottom: 1rem;">
                <input type="password" id="login-password" placeholder="Password" style="margin-bottom: 1rem;">
                <button id="btn-login" class="btn-primary" style="width: 100%;">Sign In</button>
                <div id="login-error" style="color: var(--danger); margin-top: 1rem; font-size: 0.9rem;"></div>
            </div>

            <button id="btn-logout" class="btn-danger hidden">Sign Out</button>
        </div>

        <!-- Admin Controls -->
        <div id="admin-controls" class="hidden">
            <div class="form-group">
                <label for="seasonSelect">Season</label>
                <select id="seasonSelect" onchange="loadScheduleDates()">
                    <option value="6" selected>Season 6</option>
                    <option value="5">Season 5</option>
                    <option value="4">Season 4</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dateSelect">Game Date</label>
                <select id="dateSelect">
                    <option value="">Loading dates...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gameType">Game Type</label>
                <select id="gameType">
                    <option value="regular">Regular Season</option>
                    <option value="playoff">Playoff Game</option>
                </select>
            </div>

            <div class="form-group hidden" id="playoffSeriesGroup">
                <label for="playoffSeries">Playoff Series</label>
                <select id="playoffSeries">
                    <option value="Wild-Card">Wild Card Round</option>
                    <option value="Semi-Finals">Semi-Finals Round</option>
                    <option value="Championship">Championship</option>
                    <option value="Third-Place">3rd Place Match</option>
                </select>
                <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Used to group games together in a Best-of-X series.</small>
            </div>

            <div class="btn-group">
                <button id="btn-fetch" class="btn-primary">Fetch & Write Scores</button>
                <button id="btn-recap" class="btn-primary" style="background: var(--gold-mid); color: #000; border: none;">Generate Recap</button>
                <button id="btn-undo" class="btn-danger">Undo Writes for Date</button>
            </div>

            <pre id="output">Waiting for command...</pre>
        </div>

    </div>

    <script type="module">
        import { initNav, HISTORICAL_CSVS } from './js/app.js';
        import { db, auth } from './js/firebase-config.js';
        import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js';
        import { doc, setDoc, deleteDoc, getDoc, collection, query, where, getDocs, writeBatch, increment } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js';

        // Initialize Global Nav
        initNav();

        // --- AUTH LOGIC ---
        const userDisplay = document.getElementById('user-display');
        const loginContainer = document.getElementById('login-container');
        const adminControls = document.getElementById('admin-controls');
        const btnLogout = document.getElementById('btn-logout');
        const btnLogin = document.getElementById('btn-login');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userDisplay.textContent = `Logged in securely as: ${user.email}`;
                loginContainer.classList.add('hidden');
                btnLogout.classList.remove('hidden');
                adminControls.classList.remove('hidden');
            } else {
                userDisplay.textContent = 'Restricted Access. Please log in.';
                loginContainer.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                adminControls.classList.add('hidden');
            }
        });

        btnLogin.addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const err = document.getElementById('login-error');
            err.textContent = '';
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                err.textContent = error.message;
            }
        });

        btnLogout.addEventListener('click', () => signOut(auth));

        // --- FORM TOGGLES ---
        const gameTypeSelect = document.getElementById('gameType');
        const playoffSeriesGroup = document.getElementById('playoffSeriesGroup');

        gameTypeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'playoff') {
                playoffSeriesGroup.classList.remove('hidden');
            } else {
                playoffSeriesGroup.classList.add('hidden');
            }
        });

        // --- FETCH & WRITE LOGIC ---
        const workerProxy = 'https://rda-worker.coledecker04.workers.dev/';
        const REAL_AUTH_TOKEN = 'xnr5VpW3!ApZk8L2E!4fe6e26f-949f-4936-ae3e-16384878932f'; 
        const REAL_VERSION = '27';
        
        // Configuration mapping for Seasons (Mapped precisely to app.js)
        const seasonConfigs = {
            '4': {
                players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7pZmpj4lJiBMkcjcgzJ77n2xmFIRlmuD-0Zuakz8lZekYobXkmTjfaEwhJYdNuM5F9VKlDm-FPaw8/pub?gid=561111419&single=true&output=csv',
                schedule: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS93Cbk4JUmCBgtIR1-RnSHlYY9E-dxEEWVT_Jx-T_Lm07oa6KYlnBGAqaGJin4VBpG4GmOGn8ktTPy/pub?gid=1921814921&single=true&output=csv'
            },
            '5': {
                players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7pZmpj4lJiBMkcjcgzJ77n2xmFIRlmuD-0Zuakz8lZekYobXkmTjfaEwhJYdNuM5F9VKlDm-FPaw8/pub?gid=292583226&single=true&output=csv',
                schedule: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS93Cbk4JUmCBgtIR1-RnSHlYY9E-dxEEWVT_Jx-T_Lm07oa6KYlnBGAqaGJin4VBpG4GmOGn8ktTPy/pub?gid=44168754&single=true&output=csv'
            },
            '6': {
                players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7pZmpj4lJiBMkcjcgzJ77n2xmFIRlmuD-0Zuakz8lZekYobXkmTjfaEwhJYdNuM5F9VKlDm-FPaw8/pub?gid=386743668&single=true&output=csv',
                schedule: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS93Cbk4JUmCBgtIR1-RnSHlYY9E-dxEEWVT_Jx-T_Lm07oa6KYlnBGAqaGJin4VBpG4GmOGn8ktTPy/pub?gid=1595040071&single=true&output=csv'
            }
        };

        const output = document.getElementById('output');
        const dateSelect = document.getElementById('dateSelect');
        const seasonSelect = document.getElementById('seasonSelect');

        document.getElementById('btn-fetch').addEventListener('click', performFetchAndWrite);
        document.getElementById('btn-undo').addEventListener('click', performUndo);
        document.getElementById('btn-recap').addEventListener('click', generateRecap);

        // Bulletproof CSV Parser required for schedule & player data
        function parseCsvLocal(csvText) {
            if (!csvText || csvText.trim().startsWith('<')) return [];
            const rows = csvText.trim().split(/\r?\n/);
            if (rows.length < 2) return [];
            const delimiter = rows[0].includes('\t') ? '\t' : ',';
            const headers = rows[0].split(delimiter).map(h => h.replace(/^[\uFEFF\u200B]+/, '').replace(/"/g, '').trim().toLowerCase());
            return rows.slice(1).map(row => {
                let inQuotes = false; let currentVal = ''; const values = [];
                for (let i = 0; i < row.length; i++) {
                    const char = row[i];
                    if (char === '"' && (i === 0 || row[i-1] !== '\\')) inQuotes = !inQuotes;
                    else if (char === delimiter && !inQuotes) { values.push(currentVal.trim()); currentVal = ''; }
                    else currentVal += char;
                }
                values.push(currentVal.trim());
                const obj = {};
                headers.forEach((h, i) => {
                    let val = values[i] !== undefined ? values[i] : '';
                    obj[h] = val.replace(/^"|"$/g, '').trim();
                });
                return obj;
            });
        }

        // Make it accessible globally for the select onchange attribute
        window.loadScheduleDates = async function() {
            const season = seasonSelect.value;
            const config = seasonConfigs[season];
            
            try {
                dateSelect.innerHTML = '<option value="">Loading dates...</option>';
                const res = await fetch(workerProxy + '?url=' + encodeURIComponent(config.schedule));
                if (!res.ok) throw new Error("Network response was not ok");
                const text = await res.text();
                
                const data = parseCsvLocal(text);
                const uniqueDates = new Set();
                
                data.forEach(r => {
                    const d = r['date'];
                    if (d) uniqueDates.add(d);
                });

                const parseSortableDate = (dateStr) => {
                    if (!dateStr) return 0;
                    const parts = dateStr.split('/');
                    if (parts.length >= 2) {
                        const month = parseInt(parts[0], 10);
                        const day = parseInt(parts[1], 10);
                        let year = new Date().getFullYear();
                        if (parts.length === 3) year = parseInt(parts[2], 10);
                        if (year < 100) year += 2000;
                        return new Date(year, month - 1, day).getTime();
                    }
                    const d = new Date(dateStr);
                    return isNaN(d) ? 0 : d.getTime();
                }

                const sortedDates = [...uniqueDates].sort((a, b) => parseSortableDate(a) - parseSortableDate(b));

                dateSelect.innerHTML = '';
                sortedDates.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d;
                    dateSelect.appendChild(opt);
                });

                if (sortedDates.length === 0) {
                    dateSelect.innerHTML = '<option value="">No dates found in schedule</option>';
                }
            } catch (e) {
                dateSelect.innerHTML = '<option value="">Error loading schedule</option>';
                console.error("Failed to load dates:", e);
            }
        }
        
        window.loadScheduleDates();

        function generateRequestToken() {
            const timestampMs = Date.now();
            // @ts-ignore
            const hasher = new Hashids("realwebapp", 16);
            return hasher.encode(timestampMs);
        }
        
        async function fetchSingleData(url, retries = 0) {
            const token = generateRequestToken();
            const uuid = crypto.randomUUID();
            
            // Sending credentials via URL parameter to bypass preflight requests securely
            const proxyUrl = `${workerProxy}?url=${encodeURIComponent(url)}&auth=${encodeURIComponent(REAL_AUTH_TOKEN)}&uuid=${uuid}&token=${token}`;
            
            try {
                const res = await fetch(proxyUrl);
                if (res.status === 429 || res.status === 502) {
                    if (retries < 3) {
                        await new Promise(r => setTimeout(r, 2000));
                        return fetchSingleData(url, retries + 1);
                    }
                }
                if (res.ok) {
                    const data = await res.json();
                    return { status: res.status, data: data };
                }
                return { status: res.status, data: null };
            } catch (error) {
                return { status: 500, data: null };
            }
        }

        async function performFetchAndWrite() {
            const selectedDate = dateSelect.value.trim();
            const season = seasonSelect.value;
            const config = seasonConfigs[season];
            const isPlayoff = gameTypeSelect.value === 'playoff';

            if (!selectedDate) { output.textContent = 'Error: Please select a date.'; return; }
            
            output.textContent = `Initializing fetch for Season ${season} on ${selectedDate}...\n`;
            const logs = [];
            const batch = writeBatch(db);

            try {
                // 1. Fetch CSVs
                const [playersRes, scheduleRes] = await Promise.all([
                    fetch(workerProxy + '?url=' + encodeURIComponent(config.players)),
                    fetch(workerProxy + '?url=' + encodeURIComponent(config.schedule))
                ]);
                
                const playersCsvText = await playersRes.text();
                const scheduleCsvText = await scheduleRes.text();

                // 2. Parse Schedule and Extract "Active Sports" Filter
                const scheduleData = parseCsvLocal(scheduleCsvText);
                const activeSports = new Set();
                const todayGames = [];
                
                // Inspect headers to find all dynamic Sport columns
                const schedSampleHeaders = Object.keys(scheduleData[0] || {});
                const sportCols = schedSampleHeaders.filter(h => h.startsWith('sport') || h.includes('active'));

                scheduleData.forEach(r => {
                    if (r['date'] === selectedDate) {
                        const t1 = r['team 1'] || r['team1'];
                        const t2 = r['team 2'] || r['team2'];
                        todayGames.push({ team1: t1, team2: t2 });
                        
                        // Collect active sports dynamically
                        sportCols.forEach(col => {
                            if (r[col] && r[col].trim() !== '') {
                                activeSports.add(r[col].trim().toUpperCase());
                            }
                        });
                    }
                });

                if (todayGames.length === 0) {
                    output.textContent += `\nNo games found in schedule for ${selectedDate}.`;
                    return;
                }

                // If schedule doesn't use dynamic sport columns, fallback to fetching all.
                const activeTeamsLower = new Set();
                todayGames.forEach(g => { 
                    if (g.team1) activeTeamsLower.add(g.team1.toLowerCase());
                    if (g.team2) activeTeamsLower.add(g.team2.toLowerCase());
                });
                
                logs.push(`Found ${todayGames.length} games.`);
                if (activeSports.size > 0) logs.push(`Active Sports Today: ${Array.from(activeSports).join(', ')}`);

                // 3. Parse Players
                const playersData = parseCsvLocal(playersCsvText);
                const pSampleHeaders = Object.keys(playersData[0] || {});
                
                const sportIdMap = {};
                pSampleHeaders.forEach(h => {
                    const m = h.match(/^([a-z]+) id$/);
                    if (m && h !== 'user id' && h !== 'draft id') sportIdMap[m[1].toUpperCase()] = h;
                });

                const allPlayerDataForDay = {};
                const fetchUrls = [];

                // 4. Build Queue (Only Queueing Active Sports!)
                playersData.forEach(row => {
                    const teamLower = row['team']?.toLowerCase();
                    const isPlaying = (row['playing?'] || row['playing'])?.toLowerCase() === 'yes';
                    
                    if (teamLower && activeTeamsLower.has(teamLower) && isPlaying) {
                        const userId = row['user id'] || row['userid'];
                        const username = row['username'];
                        if (!userId) return;

                        if (!allPlayerDataForDay[userId]) {
                            allPlayerDataForDay[userId] = { userId, username, team: row['team'], scoresBySport: {}, totalScore: 0 };
                        }

                        for (const sport in sportIdMap) {
                            // CRITICAL FIX: Only fetch the sport if it is explicitly active today!
                            if (activeSports.size > 0 && !activeSports.has(sport)) continue;
                            
                            const draftId = row[sportIdMap[sport]];
                            if (draftId) {
                                fetchUrls.push({
                                    url: `https://web.realsports.io/games/playerratingcontest/${draftId}/view/${userId}?contestType=sport&source=home`,
                                    userId, sport, team: row['team'], retries: 0
                                });
                            }
                        }
                    }
                });

                output.textContent += `\nQueueing ${fetchUrls.length} specific stat requests to Real API...\n`;

                // 5. Fetch Stats via API Worker (Sequential Pacing)
                let loaded = 0;

                for (let i = 0; i < fetchUrls.length; i++) {
                    const req = fetchUrls[i];
                    const pData = allPlayerDataForDay[req.userId];
                    
                    try {
                        const res = await fetchSingleData(req.url);
                        
                        if (res.status === 200 && res.data) {
                            const data = res.data;
                            
                            // Robust Score & Rank extraction
                            let scoreDisplay = '0';
                            if (data.info?.rankDisplayInfos?.length > 0) {
                                scoreDisplay = data.info.rankDisplayInfos[0].scoreDisplay || '0';
                            } else if (data.rankDisplayInfos?.length > 0) {
                                scoreDisplay = data.rankDisplayInfos[0].scoreDisplay || '0';
                            } else if (data.scoreDisplay) {
                                scoreDisplay = data.scoreDisplay;
                            } else if (data.info?.score !== undefined) {
                                scoreDisplay = data.info.score;
                            } else if (data.score !== undefined) {
                                scoreDisplay = data.score;
                            }
                            
                            // CRITICAL FIX: Strip commas from large scores (e.g. 1,234.50 -> 1234.50)
                            pData.scoresBySport[req.sport] = parseFloat(String(scoreDisplay).replace(/,/g, '')) || 0;
                            
                            if (data.info?.user?.userName || data.user?.userName) {
                                pData.username = data.info?.user?.userName || data.user?.userName;
                            }
                        } else {
                            pData.scoresBySport[req.sport] = 'Error';
                        }
                    } catch (e) {
                        pData.scoresBySport[req.sport] = 'Error';
                    }
                    
                    loaded++;
                    output.textContent = `Fetched ${loaded}/${fetchUrls.length}...\n`;
                    await new Promise(r => setTimeout(r, 350)); // Standard pacing
                }

                // 6. Prepare Player Database Writes
                output.textContent = `\nPreparing database writes...\n`;
                const playerColl = isPlayoff ? `s${season}-playoff-players` : `s${season}-players`;
                
                Object.values(allPlayerDataForDay).forEach(player => {
                    player.totalScore = Object.values(player.scoresBySport).reduce((sum, s) => sum + (typeof s === 'number' ? s : 0), 0);
                    
                    for (const sport in player.scoresBySport) {
                        const score = player.scoresBySport[sport];
                        if (typeof score === 'number') {
                            const docId = `${selectedDate.replace(/\//g, '.')}-${player.userId}-${sport}`;
                            batch.set(doc(db, playerColl, docId), {
                                username: player.username, userId: player.userId, team: player.team, score, date: selectedDate, sport
                            });
                            logs.push(`✓ Queued write for Player: ${player.username} (${sport}) -> ${score}`);
                        }
                    }
                });

                // 7. Game & Team Standings Writes
                const gameColl = isPlayoff ? `s${season}-playoff-games` : `s${season}-games`;
                const teamColl = `s${season}-teams`;
                const playoffsColl = `s${season}-playoffs`;

                todayGames.forEach(game => {
                    const t1 = game.team1, t2 = game.team2;
                    let t1Score = 0, t2Score = 0;
                    let t1SeriesWins = 0, t2SeriesWins = 0;

                    const p1 = Object.values(allPlayerDataForDay).filter(p => p.team.toLowerCase() === t1.toLowerCase());
                    const p2 = Object.values(allPlayerDataForDay).filter(p => p.team.toLowerCase() === t2.toLowerCase());

                    const allSportsThisMatchup = new Set();
                    [...p1, ...p2].forEach(p => Object.keys(p.scoresBySport).forEach(s => allSportsThisMatchup.add(s)));

                    [...allSportsThisMatchup].forEach(sport => {
                        const s1 = p1.reduce((sum, p) => sum + (typeof p.scoresBySport[sport] === 'number' ? p.scoresBySport[sport] : 0), 0);
                        const s2 = p2.reduce((sum, p) => sum + (typeof p.scoresBySport[sport] === 'number' ? p.scoresBySport[sport] : 0), 0);
                        
                        if (s1 > s2) t1SeriesWins++;
                        else if (s2 > s1) t2SeriesWins++;
                        
                        t1Score += s1; t2Score += s2;
                    });

                    let winner = t1SeriesWins > t2SeriesWins ? t1 : (t2SeriesWins > t1SeriesWins ? t2 : (t1Score > t2Score ? t1 : t2));
                    let loser = winner === t1 ? t2 : t1;

                    const gameId = `${selectedDate.replace(/\//g, '.')}-${t1}-vs-${t2}`.replace(/\s+/g, '');
                    batch.set(doc(db, gameColl, gameId), {
                        date: selectedDate, team1: t1, team2: t2, team1score: parseFloat(t1Score.toFixed(2)), team2score: parseFloat(t2Score.toFixed(2)),
                        winner, team1SeriesWins: t1SeriesWins, team2SeriesWins: t2SeriesWins
                    });
                    logs.push(`✓ Queued write for Game: ${t1} vs ${t2} | Winner: ${winner}`);

                    if (!isPlayoff) {
                        batch.set(doc(db, teamColl, winner), { wins: increment(1), gamesPlayed: increment(1), pointsFor: increment(winner === t1 ? t1Score : t2Score), pointsAgainst: increment(winner === t1 ? t2Score : t1Score), name: winner }, { merge: true });
                        batch.set(doc(db, teamColl, loser), { losses: increment(1), gamesPlayed: increment(1), pointsFor: increment(loser === t1 ? t1Score : t2Score), pointsAgainst: increment(loser === t1 ? t2Score : t1Score), name: loser }, { merge: true });
                        logs.push(`✓ Team standings updated for ${winner} and ${loser}`);
                    } else {
                        const sId = document.getElementById('playoffSeries').value;
                        if (sId) {
                            batch.set(doc(db, playoffsColl, sId), { [winner]: increment(1) }, { merge: true });
                            logs.push(`✓ Playoff series [${sId}] win incremented for ${winner}`);
                        }
                    }
                });

                // 8. Commit batch
                await batch.commit();
                output.textContent = "SUCCESS! All writes committed to Database.\n\n" + logs.join('\n');

            } catch (e) {
                output.textContent = `CRITICAL ERROR: ${e.message}\nCheck console for details.`;
                console.error(e);
            }
        }

        async function performUndo() {
            const selectedDate = dateSelect.value.trim();
            const season = seasonSelect.value;
            const isPlayoff = gameTypeSelect.value === 'playoff';

            if (!selectedDate) { output.textContent = 'Error: Please select a date to undo.'; return; }
            if (!confirm(`WARNING: Are you sure you want to UNDO all database writes for ${selectedDate} in Season ${season}?`)) return;

            output.textContent = `Reverting writes for ${selectedDate}...\n`;
            
            try {
                // Now targeting the Google Apps Script to delete rows in the Google Sheet
                const payload = {
                    action: 'undo_games',
                    date: selectedDate,
                    season: season,
                    isPlayoff: isPlayoff
                };

                const postRes = await fetch('https://script.google.com/macros/s/AKfycbyY4rz_46uk2JnqO4y7Os-0LHSU4TL43jPrtG-GXYUC61XU2o1QXoK0qMpdTdwzmenG/exec', {
                    method: 'POST',
                    redirect: 'follow',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const rawResponse = await postRes.text();
                output.textContent += "SUCCESS! Undo complete.\n" + rawResponse;
            } catch (e) {
                output.textContent = `ERROR during undo: ${e.message}\nCheck console.`;
                console.error(e);
            }
        }

        async function generateRecap() {
            const selectedDate = dateSelect.value.trim();
            const season = seasonSelect.value;
            const isPlayoff = gameTypeSelect.value === 'playoff';

            if (!selectedDate) { output.textContent = 'Error: Please select a date.'; return; }
            
            output.textContent = `Generating recap for ${selectedDate} from Historical CSVs...\n`;
            
            try {
                const gameType = isPlayoff ? 'playoff-games' : 'games';
                const playerType = isPlayoff ? 'playoff-players' : 'players';

                const gamesUrl = HISTORICAL_CSVS[season]?.[gameType];
                const playersUrl = HISTORICAL_CSVS[season]?.[playerType];

                if (!gamesUrl || !playersUrl) {
                    output.textContent = `Error: Missing CSV links for Season ${season} in app.js`;
                    return;
                }

                const [gamesRes, playersRes] = await Promise.all([
                    fetch(workerProxy + '?url=' + encodeURIComponent(gamesUrl)),
                    fetch(workerProxy + '?url=' + encodeURIComponent(playersUrl))
                ]);

                const gamesData = parseCsvLocal(await gamesRes.text());
                const playersData = parseCsvLocal(await playersRes.text());

                const dayGames = gamesData.filter(g => g.date === selectedDate);
                const dayPlayers = playersData.filter(p => p.date === selectedDate);

                if (dayGames.length === 0) {
                    output.textContent = `No games found in the historical file for ${selectedDate}. Make sure the automated script has pushed them to Google Sheets!`;
                    return;
                }

                let recapText = `📅 **RDA Game Day Recap - ${selectedDate}** 📅\n\n`;
                recapText += `🏆 **OVERALL MATCHUPS** 🏆\n`;

                dayGames.forEach(data => {
                    const team1 = data.team1 || data['team 1'] || '';
                    const team2 = data.team2 || data['team 2'] || '';
                    const t1Score = parseFloat(data.team1score || data['team 1 score'] || data['score 1'] || 0);
                    const t2Score = parseFloat(data.team2score || data['team 2 score'] || data['score 2'] || 0);
                    const winner = data.winner || data['winning team'] || '';
                    const t1SeriesWins = parseFloat(data.team1serieswins || data['team 1 series wins'] || 0);
                    const t2SeriesWins = parseFloat(data.team2serieswins || data['team 2 series wins'] || 0);
                    
                    const t1Class = winner === team1 ? '👑' : '';
                    const t2Class = winner === team2 ? '👑' : '';
                    
                    if (t1SeriesWins > 0 || t2SeriesWins > 0) {
                        recapText += `${t1Class} ${team1} [${t1SeriesWins}] vs [${t2SeriesWins}] ${team2} ${t2Class}\n`;
                        recapText += `   *(Pts: ${t1Score.toFixed(2)} - ${t2Score.toFixed(2)})*\n`;
                    } else {
                        recapText += `${t1Class} ${team1} [${t1Score.toFixed(2)}] vs [${t2Score.toFixed(2)}] ${team2} ${t2Class}\n`;
                    }
                });

                // Calculate Overall Top 3
                const playerTotals = {};
                dayPlayers.forEach(data => {
                    const uname = data.username || data.user || data.name || data.player || 'Unknown';
                    const team = data.team || '';
                    const score = parseFloat(data.score || data.points || 0);
                    
                    if (!playerTotals[uname]) {
                        playerTotals[uname] = { team: team, score: 0 };
                    }
                    playerTotals[uname].score += score;
                });

                const sortedOverallPlayers = Object.entries(playerTotals)
                    .map(([username, data]) => ({ username, team: data.team, score: data.score }))
                    .sort((a, b) => b.score - a.score);

                const top3Overall = sortedOverallPlayers.slice(0, 3);
                if (top3Overall.length > 0 && top3Overall[0].score > 0) {
                    recapText += `\n🌟 **OVERALL PLAYERS OF THE DAY** 🌟\n`;
                    top3Overall.forEach((p, i) => {
                        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : '🥉';
                        if (p.score > 0) recapText += `${medal} ${p.username} (${p.team}) - ${p.score.toFixed(2)} pts\n`;
                    });
                }

                // Breakdown by Sport
                const sportsList = [...new Set(dayPlayers.map(p => (p.sport || 'Unknown').toUpperCase()))].filter(s => s !== 'UNKNOWN' && s !== 'USER' && s !== 'DRAFT');
                
                if (sportsList.length > 0) {
                    recapText += `\n\n📊 **SPORT BREAKDOWNS** 📊\n`;
                    
                    sportsList.sort().forEach(sport => {
                        recapText += `\n🔹 **${sport}** 🔹\n`;
                        
                        const sportPlayers = dayPlayers.filter(p => (p.sport || '').toUpperCase() === sport);
                        const teamTotals = {};
                        sportPlayers.forEach(p => {
                            const t = p.team || 'Unknown';
                            teamTotals[t] = (teamTotals[t] || 0) + parseFloat(p.score || 0);
                        });
                        
                        // Sport Matchups
                        dayGames.forEach(data => {
                            const team1 = data.team1 || data['team 1'] || '';
                            const team2 = data.team2 || data['team 2'] || '';
                            const t1S = teamTotals[team1] || 0;
                            const t2S = teamTotals[team2] || 0;
                            
                            if (t1S > 0 || t2S > 0) {
                                const t1Class = t1S > t2S ? '✅ ' : '❌ ';
                                const t2Class = t2S > t1S ? ' ✅' : ' ❌';
                                recapText += `${t1Class}${team1} [${t1S.toFixed(2)}] vs [${t2S.toFixed(2)}] ${team2}${t2Class}\n`;
                            }
                        });

                        // Top 3 for this Sport
                        const sortedSportPlayers = sportPlayers
                            .map(p => ({ username: p.username || p.player || 'Unknown', team: p.team || '', score: parseFloat(p.score || 0) }))
                            .sort((a,b) => b.score - a.score)
                            .slice(0, 3);
                        
                        if (sortedSportPlayers.length > 0 && sortedSportPlayers[0].score > 0) {
                            recapText += `   Top Performers:\n`;
                            sortedSportPlayers.forEach((p, i) => {
                                if (p.score > 0) recapText += `   ${i+1}. ${p.username} (${p.team}) - ${p.score.toFixed(2)} pts\n`;
                            });
                        }
                    });
                }

                output.textContent = recapText;

            } catch (e) {
                output.textContent = `Error generating recap: ${e.message}`;
                console.error(e);
            }
        }
    </script>
