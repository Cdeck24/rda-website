<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RDA Live - Live Scores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles/global-v2.css">
    <style>
        body.modal-open { overflow: hidden; }

        /* Sub Navigation (2 Core Tabs) */
        .sub-nav-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.4s ease-out;
            flex-wrap: wrap;
        }

        .sub-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 700;
            padding: 0.5rem 1.25rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sub-nav-btn:hover { color: var(--text-main); }
        .sub-nav-btn.active { color: var(--gold-light); border-bottom: 2px solid var(--gold-mid); }

        /* Loading Indicator */
        #loading {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 2rem;
            margin: 1.5rem auto;
            max-width: 500px;
            text-align: center;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease-out;
        }

        .progress-bar-container {
            width: 100%; 
            height: 6px; 
            background: rgba(255,255,255,0.1);
            border-radius: 4px; 
            margin: 1rem 0; 
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%; 
            background: var(--gold-mid); 
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .content-view {
            display: none;
            max-width: 880px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 0 0.5rem;
            animation: fadeIn 0.3s ease-out;
        }
        .content-view.active {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        #results { width: 100%; }
        .matchup-dropdown {
            width: 100%;
            box-sizing: border-box;
            margin-top: 1rem;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
        }

        .dropdown-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 1rem 1.25rem;
            cursor: pointer;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            user-select: none;
        }
        .dropdown-header:hover { background: linear-gradient(180deg, rgba(51, 65, 85, 0.95) 0%, rgba(30, 41, 59, 1) 100%); }

        .header-team-block {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            width: 100%;
        }
        .header-team-block.away { justify-content: flex-start; }
        .header-team-block.home { justify-content: flex-end; }

        .header-logo-container { width: 38px; height: 38px; flex-shrink: 0; }
        .header-team-logo { width: 100%; height: 100%; object-fit: contain; }
        .header-team-name { font-size: 1rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .header-center-block { display: flex; flex-direction: column; align-items: center; padding: 0 1rem; }
        .header-scores-row { display: flex; align-items: center; gap: 0.5rem; }
        .header-series-score { font-size: 1.6rem; font-weight: 900; color: #fff; }
        .header-series-score.winning-score { color: var(--gold-mid); text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .header-dash { color: var(--text-muted); font-size: 1.2rem; }

        .header-actions-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2px 8px;
            margin-top: 4px;
        }
        .header-toggle-icon { font-size: 0.85rem; color: var(--text-muted); transition: transform 0.25s ease; }
        .matchup-dropdown.open .header-toggle-icon { transform: rotate(45deg); color: var(--gold-light); }
        .refresh-matchup-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0; font-size: 0.95rem; line-height: 1; }
        .refresh-matchup-btn:hover { color: #fff; }

        /* --- Analytics Banner & Win Probability --- */
        .analytics-summary-banner {
            background: rgba(0, 0, 0, 0.35);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 1.25rem;
            display: flex !important;
            flex-direction: column;
            gap: 0.75rem;
            box-sizing: border-box;
        }

        .wp-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: #cbd5e1;
        }
        .wp-label { color: var(--gold-mid); font-size: 0.68rem; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 700; }

        .wp-bar-wrapper {
            width: 100%;
            height: 18px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 999px;
            overflow: hidden;
            display: flex;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 4px;
        }
        .wp-bar-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 900;
            color: #0f172a;
            transition: width 0.4s ease;
        }
        .wp-bar-segment.left { background: linear-gradient(90deg, #d4af37, #facc15); }
        .wp-bar-segment.right { background: linear-gradient(90deg, #38bdf8, #60a5fa); }

        .impact-athlete-callout {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 6px;
            padding: 0.4rem 0.75rem;
            text-align: center;
            font-size: 0.72rem;
            color: var(--gold-light);
        }

        .athletes-status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .athlete-status-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
        }
        .status-pill-list { display: flex; gap: 8px; font-weight: 700; color: #fff; }

        /* --- Segmented View Switcher --- */
        .matchup-view-toggle {
            display: flex;
            justify-content: center;
            padding: 0.75rem 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-subtle);
        }
        .segmented-control {
            display: inline-flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            gap: 2px;
        }
        .matchup-view-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .matchup-view-btn.active {
            background: var(--bg-navy-light);
            color: var(--gold-light);
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* --- Athlete Rosters View --- */
        .analytics-columns-wrap {
            display: flex;
            width: 100%;
            gap: 0;
            padding: 4px;
            box-sizing: border-box;
        }
        .analytics-col {
            display: flex;
            flex-direction: column;
            flex: 0 0 50%;
            width: 50%;
            box-sizing: border-box;
        }
        .analytics-col.left { align-items: flex-start; border-right: 1px solid rgba(255,255,255,0.05); padding-right: 0.5rem; }
        .analytics-col.right { align-items: flex-end; padding-left: 0.5rem; }

        .athlete-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            padding: 6px 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .athlete-pill.left { flex-direction: row; text-align: left; }
        .athlete-pill.right { flex-direction: row-reverse; text-align: right; }

        .athlete-pill img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
            background: #000;
        }
        .athlete-pill .pill-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            min-width: 0;
        }
        .athlete-pill .pill-top {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }
        .athlete-pill.left .pill-top { justify-content: flex-start; }
        .athlete-pill.right .pill-top { justify-content: flex-end; }

        /* --- Sport Cards --- */
        .sport-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            margin-bottom: 0.6rem;
            overflow: hidden;
        }
        .sport-card.total-card {
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.08) 0%, rgba(15, 23, 42, 0.4) 100%);
            border: 1px solid var(--border-gold);
            margin-top: 0.75rem;
            margin-bottom: 0.85rem;
        }

        .sport-card .score-details {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0.75rem 1rem;
            cursor: pointer;
            user-select: none;
        }
        .sport-card .score-details:hover { background: rgba(255,255,255,0.03); }

        .sport-side { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .sport-side.away { justify-content: flex-start; }
        .sport-side.home { justify-content: flex-end; flex-direction: row-reverse; }

        .sport-side img { width: 24px; height: 24px; object-fit: contain; }
        .sport-side span { font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .sport-center-block { display: flex; flex-direction: column; align-items: center; padding: 0 0.75rem; }
        .sport-scores-row { display: flex; align-items: center; gap: 0.5rem; }
        .sport-card .team-score { font-size: 1.15rem; font-weight: 800; color: #fff; }
        .sport-card .team-score.winning-score { color: var(--gold-mid); }
        .sport-game-status { font-size: 0.62rem; color: var(--gold-dark); font-weight: 800; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

        .sport-players-container {
            display: none;
            margin-top: 0.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sport-card.open .sport-players-container { display: block; }

        /* --- Head-to-Head Table & Player Rows --- */
        .h2h-container {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            width: 100%;
            margin-top: 0.5rem;
        }
        .h2h-header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-subtle);
        }
        .h2h-team {
            padding: 0.5rem 0.85rem;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .h2h-team.left-team { text-align: left; border-right: 1px solid var(--border-subtle); }
        .h2h-team.right-team { text-align: right; }

        .h2h-row-group {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
        }
        .h2h-row-group:last-child { border-bottom: none; }

        .h2h-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr);
            align-items: stretch;
        }
        .h2h-divider, .drawer-divider { background: var(--border-subtle); width: 1px; height: 100%; }

        .h2h-player-cell {
            padding: 0.45rem 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.2s;
            height: 44px;
            min-height: 44px;
            box-sizing: border-box;
            gap: 0.5rem;
        }
        .h2h-player-cell:hover { background: rgba(255, 255, 255, 0.06); }
        .h2h-player-cell.left { flex-direction: row; }
        .h2h-player-cell.right { flex-direction: row-reverse; }

        .h2h-name-wrap { display: flex; align-items: center; gap: 6px; flex: 1 1 0; min-width: 0; overflow: hidden; }
        .h2h-name-col { display: flex; flex-direction: column; overflow: hidden; flex: 1; justify-content: center; gap: 1px; }
        .h2h-name { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; font-weight: 600; color: #e2e8f0; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .h2h-player-cell.right .h2h-name { justify-content: flex-end; }
        .h2h-rank { font-size: 0.6rem; color: var(--text-muted); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .h2h-score { font-size: 0.95rem; font-weight: 800; color: #fff; flex: 0 0 auto; }

        .h2h-drawers { display: flex; flex-direction: row; align-items: stretch; width: 100%; }
        .player-sport-scores { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
        .sport-score { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); color: #e2e8f0; font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 5px; }
        .sport-score.duplicate-clickable { cursor: pointer; }
        .drawer { display: none; flex: 1; background: rgba(0,0,0,0.5); padding: 0.6rem; box-sizing: border-box; }
        .drawer.expanded { display: block; }
        .pl-lineup { display: flex; flex-direction: row; gap: 0.5rem; width: 100%; overflow-x: auto; }
        .sport-lineup-player { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 40px; min-width: 34px; }
        .sport-player-avatar-container { position: relative; width: 28px; height: 28px; margin-bottom: 0.2rem; }
        .sport-player-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); background-color: #000; }
        .sport-player-multiplier { position: absolute; top: -3px; left: -4px; background: var(--bg-navy); color: #fff; border-radius: 50%; padding: 1px 3px; font-size: 0.5rem; font-weight: bold; border: 1px solid var(--border-subtle); }
        .sport-player-display-name { font-weight: 500; font-size: 0.56rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; color: var(--text-muted); }

        .rookie-badge { color: var(--gold-mid); background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.4); font-size: 0.5rem; padding: 1px 3px; border-radius: 3px; font-weight: 800; }
        .dup-badge { background: var(--danger); color: #fff; font-size: 0.5rem; padding: 1px 3px; border-radius: 3px; font-weight: 800; cursor: pointer; }
        .duplicate-cell { background: rgba(244, 67, 54, 0.08) !important; border-left: 2px solid var(--danger); }

        /* Universal Cache Status Bar */
        .cache-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.95));
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            padding: 0.6rem 1rem;
            max-width: 880px;
            margin: 0 auto 1.25rem auto;
            font-size: 0.8rem;
            color: var(--text-muted);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        .cache-sync-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.1));
            border: 1px solid var(--border-gold);
            color: var(--gold-light);
            font-weight: 700;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        .cache-sync-btn:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.35), rgba(212, 175, 55, 0.2));
            color: #fff;
            transform: translateY(-1px);
        }

        .dropdown-content { display: none; padding: 0; background: rgba(0, 0, 0, 0.25); border-top: 1px solid var(--border-subtle); }
        .matchup-dropdown.open .dropdown-content { display: block; }

        .game-analytics-header { cursor: pointer; transition: background 0.2s ease; user-select: none; }
        .game-analytics-header:hover { background: rgba(255, 255, 255, 0.06) !important; }
        .game-analytics-header.open .game-toggle-icon { transform: rotate(180deg); }
        .game-analytics-header.open + .game-analytics-content { display: block !important; }

        .diff-badge {
            font-size: 0.55rem;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            line-height: 1;
            flex-shrink: 0;
        }
        .diff-badge.unique { background: rgba(212, 175, 55, 0.15); color: var(--gold-mid); border: 1px solid rgba(212, 175, 55, 0.35); }
        .diff-badge.shared { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }
        .diff-badge.advantage { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.35); }
        .diff-badge.deficit { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.35); }

        /* --- Daily Leaderboard Sport Breakdown Chips --- */
        .leaderboard-sport-scores {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
            margin-top: 5px;
        }
        .lb-sport-chip {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.68rem;
            color: #cbd5e1;
        }
        .lb-sport-chip.active-filter {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.4);
        }
        .lb-sport-label {
            color: var(--text-muted);
            font-size: 0.62rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .lb-sport-chip.active-filter .lb-sport-label { color: var(--gold-mid); }
        .lb-sport-val { font-variant-numeric: tabular-nums; font-weight: 700; color: #fff; }
        .lb-sport-chip.active-filter .lb-sport-val { color: var(--gold-light); }

        .leaderboard-table { width: 100%; border-collapse: collapse; }
        .leaderboard-table th { background: rgba(0, 0, 0, 0.3); color: var(--gold-mid); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-subtle); }
        .leaderboard-table td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border-subtle); color: var(--text-main); font-size: 0.9rem; vertical-align: middle; }
        .leaderboard-table tr:hover { background: rgba(255, 255, 255, 0.03); }
        .rank-cell { font-weight: bold; width: 70px; text-align: center; }
        .score-cell { font-weight: 800; text-align: right; color: var(--gold-light); width: 130px; padding-right: 1.5rem !important; }
        .rank-1 { color: #FFD700; }
        .rank-2 { color: #C0C0C0; }
        .rank-3 { color: #CD7F32; }

        @media (max-width: 650px) {
            .dropdown-header { padding: 0.75rem; }
            .header-logo-container { width: 32px; height: 32px; }
            .header-team-name { font-size: 0.85rem; }
            .header-series-score { font-size: 1.3rem; }
            .athletes-status-grid { grid-template-columns: 1fr; gap: 0.4rem; }
            .sport-card .score-details { padding: 0.6rem 0.75rem; }
            .sport-side span { font-size: 0.75rem; }
            .sport-card .team-score { font-size: 1rem; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hashids@2.2.10/dist/hashids.min.js"></script>
</head>
<body>
    <h1>RDA Live</h1>
    
    <div class="sub-nav-container">
        <button class="sub-nav-btn active" id="tab-live" onclick="switchTab('live')">Matchups</button>
        <button class="sub-nav-btn" id="tab-leaderboard" onclick="switchTab('leaderboard')">Daily Leaderboard</button>
    </div>

    <div class="cache-status-bar" id="universal-cache-bar" style="display: none;">
        <div>⚡ <span id="cache-status-label">Universal Cache</span>: <strong id="cache-time-text" style="color: #fff;">--</strong></div>
        <button class="cache-sync-btn" id="cache-refresh-all-btn" onclick="triggerUniversalSync()">↻ Sync Fresh Scores</button>
    </div>

    <div id="loading" style="display: none;">
        <div style="font-weight: 700; color: #fff; font-size: 1.1rem; margin-bottom: 0.5rem;" id="loading-text">Synchronizing Data...</div>

        function normalizeSportName(sport) {
            if (!sport) return '';
            const s = String(sport).trim().toUpperCase();
            if (s === 'SOCCER') return 'FC';
            if (s === 'NCAAF') return 'CFB';
            if (s === 'NCAAB') return 'CBB';
            return s;
        }

        function isSportTargetMatch(targetSports, sport) {
            if (!targetSports || targetSports.length === 0) return false;
            if (targetSports.includes('ALL')) return true;
            const norm = normalizeSportName(sport);
            return targetSports.some(sp => normalizeSportName(sp) === norm);
        }

        function getTargetAccountConfig(userId, username) {
            if (userId && DUPLICATE_TARGETS[userId]) return DUPLICATE_TARGETS[userId];
            if (username) {
                const clean = username.trim().toLowerCase().replace(/^@/, '');
                for (const [id, cfg] of Object.entries(DUPLICATE_TARGETS)) {
                    if (cfg.username.toLowerCase().replace(/^@/, '') === clean) return cfg;
                }
            }
            return null;
        }

        function runDuplicateChecker() {
            const hashes = new Map();
            Object.values(window.playersToFetch).forEach(p => {
                p.isDuplicate = {};
                p.duplicateWith = {};
                if (p.isBench) return;
                for (const s in p.lineupsBySport) {
                    const upperS = s.toUpperCase();
                    if (upperS === 'DRAFT' || upperS === 'SPORT' || upperS === 'USER') continue;
                    const l = p.lineupsBySport[s];
                    if (!Array.isArray(l) || !l.length) continue;
                    const h = `${upperS}:${l.map(x => {
                        const lp = x.player || x;
                        return (lp.displayName || x.displayName || lp.name || x.name || '').trim();
                    }).join(',')}`;
                    if (!hashes.has(h)) hashes.set(h, []);
                    hashes.get(h).push({ player: p, sport: s });
                }
            });

            for (const entries of hashes.values()) {
                if (entries.length <= 1) continue;
                for (let i = 0; i < entries.length; i++) {
                    const curr = entries[i], violators = new Set();
                    for (let j = 0; j < entries.length; j++) {
                        if (i === j) continue;
                        const other = entries[j];
                        const isSameTeam = curr.player.team && curr.player.team !== 'Free Agent' && other.player.team && curr.player.team.toLowerCase() === other.player.team.toLowerCase();
                        if (isSameTeam) violators.add(other.player.username);
                        const otherTarget = getTargetAccountConfig(other.player.userId, other.player.username);
                        if (otherTarget && isSportTargetMatch(otherTarget.sports, curr.sport)) {
                            if (curr.player.userId !== other.player.userId) violators.add(otherTarget.username || other.player.username);
                        }
                    }
                    if (violators.size > 0) {
                        curr.player.isDuplicate[curr.sport] = true;
                        curr.player.duplicateWith[curr.sport] = [...violators];
                    }
                }
            }
        }

        const REAL_AUTH_TOKENS = [
            'xnr5VpW3!ApZk8L2E!4fe6e26f-949f-4936-ae3e-16384878932f',
            'xnrGVlRJ!GYZ9e1oA!f1725a9c-9931-4b39-b59e-99fdba54b583'
        ];
        const disabledTokens = new Set();
        let currentTokenIdx = 0;

        function getNextAuthToken() {
            const active = REAL_AUTH_TOKENS.filter(t => t && !t.includes('PASTE_YOUR') && !disabledTokens.has(t));
            if (!active.length) return REAL_AUTH_TOKENS[0];
            const t = active[currentTokenIdx % active.length];
            currentTokenIdx++;
            return t;
        }

        function generateRequestToken() {
            // @ts-ignore
            return new Hashids("realwebapp", 16).encode(Date.now());
        }

        async function fetchSingleData(url) {
            const token = generateRequestToken();
            const uuid = crypto.randomUUID();
            const authToken = getNextAuthToken();
            const proxyUrl = `${workerProxy}?url=${encodeURIComponent(url)}&auth=${encodeURIComponent(authToken)}&uuid=${uuid}&token=${token}`;
            try {
                const res = await fetch(proxyUrl);
                if (res.status === 401) { disabledTokens.add(authToken); return { status: 401, data: null }; }
                if (res.ok) return { status: res.status, data: await res.json() };
                return { status: res.status, data: null };
            } catch (e) {
                return { status: 500, data: null };
            }
        }

        async function fetchCSV(url) {
            try {
                const cacheBusterUrl = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
                const res = await fetch(cacheBusterUrl, { cache: 'no-store' });
                if (!res.ok) throw new Error(`Fetch error`);
                const text = await res.text();
                return text.split('\n').map(line => {
                    const cleanedLine = line.trim();
                    if (!cleanedLine.length) return [];
                    const values = [];
                    let currentVal = '', inQuotes = false;
                    for (let i = 0; i < cleanedLine.length; i++) {
                        const char = cleanedLine[i];
                        if (char === '"' && (i === 0 || cleanedLine[i-1] !== '\\')) inQuotes = !inQuotes;
                        else if (char === ',' && !inQuotes) { values.push(currentVal.trim()); currentVal = ''; }
                        else currentVal += char;
                    }
                    values.push(currentVal.trim());
                    return values;
                }).filter(row => row.length > 0 && row.some(c => c && c.length > 0));
            } catch (e) {
                return [];
            }
        }

        function getCurrentDateStringEST() {
            const now = new Date();
            const options = { timeZone: "America/New_York", year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', hour12: false };
            const parts = new Intl.DateTimeFormat('en-US', options).formatToParts(now);
            const partValue = (type) => parts.find(p => p.type === type)?.value;
            let month = parseInt(partValue('month'));
            let day = parseInt(partValue('day'));
            let hour = parseInt(partValue('hour'));
            if (hour === 24) hour = 0;
            if (hour < 10) {
                const estDate = new Date(Date.UTC(parseInt(partValue('year')), month - 1, day));
                estDate.setUTCDate(estDate.getUTCDate() - 1);
                month = estDate.getUTCMonth() + 1; 
                day = estDate.getUTCDate();
            }
            return `${month}/${day}`;
        }

        const isSameDate = (csvDate, todayStr) => {
            if (!csvDate) return false;
            const cleanDate = String(csvDate).trim();
            if (cleanDate === todayStr) return true;
            const parsed = new Date(cleanDate);
            if (!isNaN(parsed.getTime())) {
                if (`${parsed.getMonth() + 1}/${parsed.getDate()}` === todayStr) return true;
            }
            const partsSlash = cleanDate.split('/');
            if (partsSlash.length >= 2 && `${parseInt(partsSlash[0])}/${parseInt(partsSlash[1])}` === todayStr) return true;
            const partsDash = cleanDate.split('-');
            if (partsDash.length === 3) {
                if (partsDash[0].length === 4) {
                    if (`${parseInt(partsDash[1])}/${parseInt(partsDash[2])}` === todayStr) return true;
                } else {
                    if (`${parseInt(partsDash[0])}/${parseInt(partsDash[1])}` === todayStr) return true;
                }
            }
            return false;
        };

                if (i !== -1) return i;

            for (const n of names) {
                const i = h.findIndex(x => typeof x === 'string' && x.toLowerCase().includes(n.toLowerCase()));
                if (i !== -1) return i;
            }
            return -1;

        async function fetchRealLifeSchedules(sportsSet) {
            const promises = Array.from(sportsSet).map(async (sport) => {
                if (window.realLifeSchedules[sport] && window.realLifeSchedules[sport].games?.length > 0) return;
                const sportLower = sport.toLowerCase();
                let urlSport = sportLower;
                let cohort = 0;
                if (sportLower === 'fc' || sportLower === 'soccer') { urlSport = 'soccer'; cohort = 0; }
                else if (sportLower === 'cfb' || sportLower === 'ncaaf') { urlSport = 'ncaaf'; cohort = 777777777; }
                else if (sportLower === 'cbb' || sportLower === 'ncaab') { urlSport = 'cbb'; cohort = 0; }

                const scheduleMap = { games: [], teamToGame: {} };

                const ingestGames = (gamesList) => {
                    if (!Array.isArray(gamesList)) return;
                    gamesList.forEach(g => {
                        if (!g || !g.id) return;
                        if (scheduleMap.games.some(existing => existing.id === g.id)) return;

                        const statusText = g.display?.primary || g.status || g.state || 'Scheduled';
                        const homeTeam = g.homeTeam || {}, awayTeam = g.awayTeam || {};
                        const homeId = homeTeam.id || g.homeTeamId;
                        const awayId = awayTeam.id || g.awayTeamId;
                        const homeName = homeTeam.displayName || homeTeam.name || 'Home';
                        const awayName = awayTeam.displayName || awayTeam.name || 'Away';

                        const gameObj = {
                            id: g.id,
                            homeTeam: { id: homeId, name: homeName },
                            awayTeam: { id: awayId, name: awayName },
                            status: statusText,
                            state: g.state || g.status || '',
                            homeScore: g.display?.homeScoreDisplay ?? g.homeTeamScore ?? 0,
                            awayScore: g.display?.awayScoreDisplay ?? g.awayTeamScore ?? 0
                        };
                        scheduleMap.games.push(gameObj);
                        if (homeId) scheduleMap.teamToGame[String(homeId)] = gameObj;
                        if (awayId) scheduleMap.teamToGame[String(awayId)] = gameObj;
                        if (homeName && homeName !== 'Home') scheduleMap.teamToGame[homeName.toLowerCase().trim()] = gameObj;
                        if (awayName && awayName !== 'Away') scheduleMap.teamToGame[awayName.toLowerCase().trim()] = gameObj;
                    });
                };

                const urls = [
                    `https://web.realsports.io/home/${urlSport}?cohort=${cohort}`,
                    `https://web.realsports.io/home/${urlSport}/next?cohort=${cohort}`
                ];

                await Promise.all(urls.map(async (u) => {
                    const proxyUrl = `${workerProxy}?url=${encodeURIComponent(u)}&auth=${encodeURIComponent(getNextAuthToken())}&uuid=${crypto.randomUUID()}&token=${generateRequestToken()}`;
                    try {
                        const res = await fetch(proxyUrl);
                        if (!res.ok) return;
                        const data = await res.json();
                        ingestGames(data.latestDayContent?.games);
                        ingestGames(data.dayContent?.games);
                        ingestGames(data.games);
                        if (Array.isArray(data.days)) {
                            data.days.forEach(d => ingestGames(d.games));
                        }
                    } catch (e) {}
                }));

                window.realLifeSchedules[sport] = scheduleMap;
            });
            await Promise.all(promises);
        }

        function parseAthleteGameStatus(item, sport, scheduleMap) {
            if (!item) return { gameObj: null, isLive: false, isFinal: false, isUpcoming: true, actualScore: 0 };
            const lp = item.player || item;
            const tId = lp.teamId || item.teamId || lp.team?.id || item.team?.id;
            const teamNameStr = typeof lp.team === 'string' ? lp.team.toLowerCase().trim() : (lp.team?.name ? lp.team.name.toLowerCase().trim() : null);
            
            let gameObj = null;
            if (tId && scheduleMap?.teamToGame?.[String(tId)]) {
                gameObj = scheduleMap.teamToGame[String(tId)];
            } else if (teamNameStr && scheduleMap?.teamToGame?.[teamNameStr]) {
                gameObj = scheduleMap.teamToGame[teamNameStr];
            } else if (item.game || lp.game || item.matchup) {
                const rawG = item.game || lp.game || item.matchup;
                const homeTeam = rawG.homeTeam || {};
                const awayTeam = rawG.awayTeam || {};
                gameObj = {
                    id: rawG.id || 'game-' + Math.random(),
                    homeTeam: { id: homeTeam.id || rawG.homeTeamId, name: homeTeam.displayName || homeTeam.name || 'Home' },
                    awayTeam: { id: awayTeam.id || rawG.awayTeamId, name: awayTeam.displayName || awayTeam.name || 'Away' },
                    status: rawG.display?.primary || rawG.status || rawG.state || 'Scheduled',
                    state: rawG.state || rawG.status || '',
                    homeScore: rawG.display?.homeScoreDisplay ?? rawG.homeTeamScore ?? 0,
                    awayScore: rawG.display?.awayScoreDisplay ?? rawG.awayTeamScore ?? 0
                };
            }

            const rawSt = (gameObj?.status || '').toLowerCase();
            const rawState = (gameObj?.state || '').toLowerCase();
            const actualScore = parseFloat(item.score ?? lp.score ?? item.points ?? lp.points ?? 0) || 0;

            let isFinal = false;
            let isLive = false;
            let isUpcoming = false;

            if (rawSt.includes('final') || rawSt.includes('ended') || rawSt.includes('ft') || rawState === 'final' || rawState === 'ended') {
                isFinal = true;
            } else if (
                rawSt.includes("'") || 
                rawSt.includes('q') || 
                rawSt.includes('half') || 
                rawSt.includes('ht') || 
                rawSt.includes('top') || 
                rawSt.includes('bot') || 
                rawSt.includes('mid') || 
                rawSt.includes('end') || 
                rawSt.includes('inn') || 
                rawSt.includes('1st') || 
                rawSt.includes('2nd') || 
                rawSt.includes('3rd') || 
                rawSt.includes('4th') || 
                rawSt.includes('ot') ||
                rawSt.includes('live') ||
                rawState === 'live' || 
                rawState === 'in_progress' ||
                rawState === 'active'
            ) {
                isLive = true;
            } else if (actualScore > 0) {
                isLive = true;
            } else {
                isUpcoming = true;
            }

            return { gameObj, isLive, isFinal, isUpcoming, actualScore };
        }

        function calculateMatchupWinProbability(team1, team2, sortedSports) {
            const team1Players = (window.teamsDataCache[team1] || []).filter(p => !p.isBench);
            const team2Players = (window.teamsDataCache[team2] || []).filter(p => !p.isBench);
            const SPORT_PROFILES = {
                'WNBA': { mean: 6.9, std: 2.8 }, 'NBA': { mean: 6.6, std: 2.6 }, 'MLB': { mean: 5.7, std: 4.2 },
                'CBB': { mean: 5.2, std: 2.2 }, 'CFB': { mean: 5.2, std: 2.5 }, 'NFL': { mean: 5.0, std: 2.4 },
                'NHL': { mean: 4.0, std: 2.0 }, 'FC': { mean: 3.1, std: 1.8 }, 'DEFAULT': { mean: 5.5, std: 2.5 }
            };

            const athleteImpactMap = new Map();
            const sportData = (sortedSports || []).map(sport => {
                const profile = SPORT_PROFILES[sport.toUpperCase()] || SPORT_PROFILES['DEFAULT'];
                const scheduleMap = window.realLifeSchedules[sport] || { teamToGame: {} };
                let curScore1 = 0, curScore2 = 0;
                const remainingPicks1 = [], remainingPicks2 = [];

                const collect = (players, isT1) => {
                    players.forEach(p => {
                        const sc = p.scoresBySport?.[sport];
                        if (typeof sc === 'number') { if (isT1) curScore1 += sc; else curScore2 += sc; }
                        const lineup = Array.isArray(p.lineupsBySport?.[sport]) ? p.lineupsBySport[sport] : [];
                        lineup.forEach(item => {
                            const lp = item.player || item;
                            const aName = (lp.displayName || item.displayName || lp.name || '').trim();
                            if (!aName) return;
                            const mult = parseFloat(item.multiplierDisplay || lp.multiplierDisplay || item.multiplier || 1) || 1;
                            
                            const stInfo = parseAthleteGameStatus(item, sport, scheduleMap);
                            let fracRemaining = 1.0;

                            if (stInfo.isFinal) fracRemaining = 0;
                            else if (stInfo.isLive) fracRemaining = 0.45;

                            if (fracRemaining > 0) {
                                if (isT1) remainingPicks1.push({ mult, fracRemaining }); else remainingPicks2.push({ mult, fracRemaining });
                            }

                            const key = `${sport}:${aName}`;
                            if (!athleteImpactMap.has(key)) {
                                athleteImpactMap.set(key, { name: aName, sport, t1Mult: 0, t2Mult: 0, t1TotalPoints: 0, t2TotalPoints: 0, isLive: stInfo.isLive, isFinal: stInfo.isFinal });
                            }
                            const entry = athleteImpactMap.get(key);
                            if (isT1) { entry.t1Mult += mult; entry.t1TotalPoints += stInfo.actualScore; }
                            else { entry.t2Mult += mult; entry.t2TotalPoints += stInfo.actualScore; }
                            if (stInfo.isFinal) { entry.isFinal = true; entry.isLive = false; }
                            else if (stInfo.isLive && !entry.isFinal) entry.isLive = true;
                        });
                    });
                };
                collect(team1Players, true); collect(team2Players, false);
                return { sport, profile, curScore1, curScore2, remainingPicks1, remainingPicks2 };
            });

            let highestImpactAthlete = null;
            let maxPointEdge = 0, maxMultDiff = 0;
            let anyPointsScored = false;

            athleteImpactMap.forEach(ath => {
                if (Math.abs(ath.t1TotalPoints - ath.t2TotalPoints) > 0.05) anyPointsScored = true;
            });

            athleteImpactMap.forEach(ath => {
                const netMultDiff = Math.abs(ath.t1Mult - ath.t2Mult);
                if (netMultDiff <= 0.05) return;
                const pointDiff = Math.abs(ath.t1TotalPoints - ath.t2TotalPoints);

                if (anyPointsScored) {
                    if (pointDiff > maxPointEdge) {
                        maxPointEdge = pointDiff;
                        highestImpactAthlete = {
                            name: ath.name, sport: ath.sport,
                            advantagedTeam: ath.t1TotalPoints >= ath.t2TotalPoints ? team1 : team2,
                            netMultDiff: netMultDiff.toFixed(1).replace(/\.0$/, ''),
                            actualPointSwing: pointDiff.toFixed(1),
                            status: ath.isLive ? 'Live' : (ath.isFinal ? 'Final' : 'Upcoming')
                        };
                    }
                } else if (netMultDiff > maxMultDiff) {
                    maxMultDiff = netMultDiff;
                    highestImpactAthlete = {
                        name: ath.name, sport: ath.sport,
                        advantagedTeam: ath.t1Mult >= ath.t2Mult ? team1 : team2,
                        netMultDiff: netMultDiff.toFixed(1).replace(/\.0$/, ''),
                        actualPointSwing: '0.0',
                        status: ath.isLive ? 'Live' : (ath.isFinal ? 'Final' : 'Upcoming')
                    };
                }
            });

            let t1SeriesWins = 0, t2SeriesWins = 0, proj1 = 0, proj2 = 0;
            for (let sim = 0; sim < 1000; sim++) {
                let w1 = 0, w2 = 0, pts1 = 0, pts2 = 0;
                sportData.forEach(sd => {
                    let s1 = sd.curScore1, s2 = sd.curScore2;
                    sd.remainingPicks1.forEach(p => s1 += Math.max(0, sd.profile.mean + (Math.random() - 0.5) * sd.profile.std * 2) * p.mult * p.fracRemaining);
                    sd.remainingPicks2.forEach(p => s2 += Math.max(0, sd.profile.mean + (Math.random() - 0.5) * sd.profile.std * 2) * p.mult * p.fracRemaining);
                    pts1 += s1; pts2 += s2;
                    if (s1 > s2) w1++; else if (s2 > s1) w2++;
                });
                proj1 += w1; proj2 += w2;
                if (w1 > w2 || (w1 === w2 && pts1 > pts2)) t1SeriesWins++;
                else t2SeriesWins++;
            }

            let wp1 = Math.round((t1SeriesWins / 1000) * 100);
            return {
                wp1: Math.max(1, Math.min(99, wp1)),
                wp2: 100 - Math.max(1, Math.min(99, wp1)),
                projScore1: (proj1 / 1000).toFixed(1),
                projScore2: (proj2 / 1000).toFixed(1),
                swingAthlete: highestImpactAthlete
            };
        }

        function renderH2HSportRows(t1p, t2p, sport) {
            const sortFn = (a, b) => (typeof b.scoresBySport?.[sport] === 'number' ? b.scoresBySport[sport] : -999) - (typeof a.scoresBySport?.[sport] === 'number' ? a.scoresBySport[sport] : -999);
            const starters1 = t1p.filter(p => !p.isBench && p.scoresBySport?.[sport] !== undefined).sort(sortFn);
            const starters2 = t2p.filter(p => !p.isBench && p.scoresBySport?.[sport] !== undefined).sort(sortFn);
            const max = Math.max(starters1.length, starters2.length);

            let html = '';
            for (let i = 0; i < max; i++) {
                const p1 = starters1[i], p2 = starters2[i];
                html += `
                    <div class="h2h-row-group">
                        <div class="h2h-row">

                            ${renderH2HCell(p2, 'right', sport)}
                        </div>
                        <div class="h2h-drawers">
                            ${renderLineupDrawer(p1, 'left', sport)}
                            <div class="drawer-divider"></div>
                            ${renderLineupDrawer(p2, 'right', sport)}
                        </div>
                    </div>`;
            }
            return html || '<div style="padding:1rem;text-align:center;color:#666;">No active lineups.</div>';
        }

        function renderTotalDrawer(p, side) {
            if (!p) return `<div class="drawer ${side} empty"></div>`;
            const sortedSports = Object.keys(p.scoresBySport || {})
                .filter(s => {
                    const us = s.toUpperCase();
                    return us !== 'USER' && us !== 'DRAFT' && us !== 'SPORT';
                })
                .sort();

            if (sortedSports.length === 0) {
                return `<div class="drawer ${side}"><div style="color:#777; font-size:0.72rem; font-style:italic;">No active sports.</div></div>`;
            }

            let sportScoresHtml = `<div class="player-sport-scores" style="justify-content: ${side === 'left' ? 'flex-start' : 'flex-end'};">`;
            for (const sport of sortedSports) {
                const score = p.scoresBySport[sport];
                const isDup = p.isDuplicate && p.isDuplicate[sport];
                if (isDup) {
                    const usernamesJSON = JSON.stringify(p.duplicateWith[sport] || []).replace(/"/g, '&quot;');
                    sportScoresHtml += `<span class="sport-score duplicate-clickable" style="color: #f87171; border-color: rgba(248,113,113,0.4);" onclick="showDuplicateInfo('${sport}', ${usernamesJSON}); event.stopPropagation();">${sport}: ${typeof score === 'number' ? score.toFixed(2) : '0.00'} (D)</span>`;
                } else if (typeof score === 'number') {
                    sportScoresHtml += `<span class="sport-score">${sport}: ${score.toFixed(2)}</span>`;
                } else {
                    sportScoresHtml += `<span class="sport-score" style="color:#f87171;">${sport}: 0.00</span>`;
                }
            }
            sportScoresHtml += `</div>`;
            return `<div class="drawer ${side}">${sportScoresHtml}</div>`;
        }

        function renderH2HTotalRows(t1p, t2p) {
            const starters1 = t1p.filter(p => !p.isBench).sort((a,b) => b.totalScore - a.totalScore);
            const starters2 = t2p.filter(p => !p.isBench).sort((a,b) => b.totalScore - a.totalScore);
            const max = Math.max(starters1.length, starters2.length);
            let html = '';
            for (let i = 0; i < max; i++) {
                const p1 = starters1[i], p2 = starters2[i];
                html += `
                    <div class="h2h-row-group">
                        <div class="h2h-row">
                            ${renderH2HCell(p1, 'left', null)}
                            <div class="h2h-divider"></div>
                            ${renderH2HCell(p2, 'right', null)}
                        </div>
                        <div class="h2h-drawers">
                            ${renderTotalDrawer(p1, 'left')}
                            <div class="drawer-divider"></div>
                            ${renderTotalDrawer(p2, 'right')}

        function renderH2HCell(p, side, sport) {
            if (!p) return `<div class="h2h-player-cell ${side} empty"></div>`;
            const sc = sport ? p.scoresBySport?.[sport] : p.totalScore;
            const scoreStr = typeof sc === 'number' ? sc.toFixed(2) : '0.00';
            const isDup = sport && p.isDuplicate?.[sport];
            return `
                <div class="h2h-player-cell ${side} ${isDup ? 'duplicate-cell' : ''}" onclick="toggleH2HDrawer(this, '${side}')">

                            <div class="h2h-name"><span>${p.username}</span>${p.isRookie ? '<span class="rookie-badge">R</span>' : ''}${isDup ? `<span class="dup-badge" onclick="showDuplicateInfo('${sport}', ${JSON.stringify(p.duplicateWith[sport] || []).replace(/"/g, '&quot;')}); event.stopPropagation();">DUP</span>` : ''}</div>
                            <div class="h2h-rank">${sport ? (p.ranksBySport?.[sport] || '') : ''}</div>
                        </div>
                    </div>
                    <div class="h2h-score">${scoreStr}</div>

        function renderLineupDrawer(p, side, sport) {
            if (!p) return `<div class="drawer ${side} empty"></div>`;
            const lineup = Array.isArray(p.lineupsBySport?.[sport]) ? p.lineupsBySport[sport] : [];
            if (!lineup.length) return `<div class="drawer ${side}"><div class="pl-lineup">No lineup logged.</div></div>`;
            return `
                <div class="drawer ${side}">
                    <div class="pl-lineup">
                        ${lineup.map(item => {
                            const lp = item.player || item;
                            const avatar = lp.avatar || item.avatar || '';
                            const name = lp.displayName || item.displayName || lp.name || '';
                            const mult = item.multiplierDisplay || lp.multiplierDisplay || '1x';
                            return `
                                <div class="sport-lineup-player">
                                    <div class="sport-player-avatar-container">
                                        <img src="${avatar ? `https://media.realapp.link/assets/players/default/large/${avatar}.webp` : 'https://placehold.co/30x30/222/fff?text=?'}" class="sport-player-avatar">
                                        <div class="sport-player-multiplier">${mult}</div>

                                    <span class="sport-player-display-name">${name}</span>

                    </div>
                </div>`;
