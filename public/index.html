        function renderAthleteRostersView(t1, t2, sports, t1p, t2p) {
            let html = '';
            (sports || []).forEach(sport => {
                const scheduleMap = window.realLifeSchedules[sport] || { teamToGame: {} };
                const gameBuckets = {};

                const processAthletes = (players, side) => {
                    players.filter(p => !p.isBench).forEach(p => {
                        const lineup = Array.isArray(p.lineupsBySport?.[sport]) ? p.lineupsBySport[sport] : [];
                        lineup.forEach(item => {
                            if (!item) return;
                            const lp = item.player || item;
                            const name = (lp.displayName || item.displayName || lp.name || '').trim();
                            if (!name) return;
                            const avatar = lp.avatar || item.avatar || '';
                            const stInfo = parseAthleteGameStatus(item, sport, scheduleMap);
                            const gameObj = stInfo.gameObj;

                            let realTeamName = 'Team';
                            if (gameObj) {
                                const tId = lp.teamId || item.teamId || lp.team?.id || item.team?.id;
                                if (tId && String(tId) === String(gameObj.homeTeam.id)) {
                                    realTeamName = gameObj.homeTeam.name;
                                } else if (tId && String(tId) === String(gameObj.awayTeam.id)) {
                                    realTeamName = gameObj.awayTeam.name;
                                } else {
                                    realTeamName = gameObj.homeTeam.name || 'Team';
                                }
                            } else if (lp.team) {
                                realTeamName = typeof lp.team === 'object' ? (lp.team.name || 'Team') : lp.team;
                            }

                            const gameKey = gameObj ? (gameObj.id || `${gameObj.awayTeam.name}-${gameObj.homeTeam.name}`) : 'uncategorized';
                            if (!gameBuckets[gameKey]) {
                                gameBuckets[gameKey] = { gameObj, t1: {}, t2: {} };
                            }

                            const sideData = gameBuckets[gameKey][side];
                            if (!sideData[realTeamName]) sideData[realTeamName] = {};
                            const mult = parseFloat(item.multiplierDisplay || lp.multiplierDisplay || 1) || 1;

                            if (!sideData[realTeamName][name]) {
                                sideData[realTeamName][name] = { avatar, gms: new Set(), totalMult: 0, isLive: stInfo.isLive, isFinal: stInfo.isFinal };
                            }
                            sideData[realTeamName][name].gms.add(p.username);
                            sideData[realTeamName][name].totalMult += mult;
                        });
                    });
                };

                processAthletes(t1p, 't1');
                processAthletes(t2p, 't2');

                let gamesHtml = '';
                Object.values(gameBuckets).forEach(bucket => {
                    const { gameObj, t1: bT1, t2: bT2 } = bucket;
                    let gameTitle = 'Other / Unscheduled';
                    if (gameObj) {
                        const rawSt = (gameObj.status || '').toLowerCase();
                        let statusBadge = `<span style="color:var(--gold-mid);">${gameObj.status}</span>`;
                        if (rawSt.includes('final') || rawSt.includes('ended') || rawSt.includes('ft')) {
                            statusBadge = `<span style="color:var(--text-muted);">Final</span>`;
                        } else if (rawSt.includes("'") || rawSt.includes('q') || rawSt.includes('half') || rawSt.includes('ht') || rawSt.includes('top') || rawSt.includes('bot') || rawSt.includes('inn') || rawSt.includes('live')) {
                            statusBadge = `<span style="color:#ef4444; font-weight:800;">🔴 ${gameObj.status}</span>`;
                        }
                        gameTitle = `${gameObj.awayTeam.name} (${gameObj.awayScore}) @ ${gameObj.homeTeam.name} (${gameObj.homeScore}) &bull; ${statusBadge}`;
                    }

                    const renderList = (teamsMap, align, otherSideMap) => {
                        const tKeys = Object.keys(teamsMap).sort();
                        if (!tKeys.length) return '<div style="color:#666;font-style:italic;font-size:0.7rem;text-align:center;padding:0.4rem;">None</div>';
                        let res = '';
                        tKeys.forEach(tName => {
                            const athletes = Object.keys(teamsMap[tName]).sort();
                            athletes.forEach(aName => {
                                const data = teamsMap[tName][aName];
                                const gmList = Array.from(data.gms).join(', ');
                                
                                let otherMult = 0;
                                if (otherSideMap) {
                                    Object.values(otherSideMap).forEach(oTeam => { if (oTeam[aName]) otherMult += oTeam[aName].totalMult || 1; });
                                }
                                const thisMult = data.totalMult || 1;
                                let diffBadge = `<span class="diff-badge unique">DIFF</span>`;
                                if (otherMult > 0) {
                                    if (thisMult === otherMult) {
                                        diffBadge = `<span class="diff-badge shared">SHARED</span>`;
                                    } else if (thisMult > otherMult) {
                                        const adv = (thisMult - otherMult).toFixed(1).replace(/\.0$/, '');
                                        diffBadge = `<span class="diff-badge advantage">+${adv}x</span>`;
                                    } else {
                                        const def = (otherMult - thisMult).toFixed(1).replace(/\.0$/, '');
                                        diffBadge = `<span class="diff-badge deficit">-${def}x</span>`;
                                    }
                                }

                                const liveDot = data.isLive ? '<span style="color:#ef4444; font-size:0.65rem; margin-right:3px;">🔴</span>' : '';

                                res += `
                                    <div class="athlete-pill ${align}">
                                        <img src="${data.avatar ? `https://media.realapp.link/assets/players/default/large/${data.avatar}.webp` : 'https://placehold.co/24x24/222/fff?text=?'}" onerror="this.src='https://placehold.co/24x24/222/fff?text=?';">
                                        <div class="pill-info">
                                            <div class="pill-top">
                                                <span style="font-weight:600; font-size:0.75rem; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${liveDot}${aName}</span>
                                                ${diffBadge}
                                            </div>
                                            <span style="font-size:0.58rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${gmList}">${gmList}</span>
                                        </div>
                                    </div>`;
                            });
                        });
                        return res;
                    };

                    gamesHtml += `
                        <div style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.05); border-radius:6px; margin-bottom:0.6rem; overflow:hidden;">
                            <div class="game-analytics-header" onclick="this.classList.toggle('open'); this.nextElementSibling.classList.toggle('open');" style="background:rgba(255,255,255,0.03); padding:7px 10px; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center; font-size:0.72rem;">
                                <span>${gameTitle}</span>
                                <span class="game-toggle-icon" style="color:var(--text-muted); font-size:0.8rem; transition:transform 0.3s;">▼</span>
                            </div>
                            <div class="game-analytics-content" style="display:none;">
                                <div class="analytics-columns-wrap">
                                    <div class="analytics-col left">${renderList(bT1, 'left', bT2)}</div>
                                    <div class="analytics-col right">${renderList(bT2, 'right', bT1)}</div>
                                </div>
                            </div>
                        </div>`;
                });

                html += `
                    <div class="sport-card" style="margin-bottom: 0.85rem; padding: 0.75rem;">
                        <div style="font-weight: 800; color: var(--gold-mid); text-align: center; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 0.75rem; letter-spacing:1px;">${sport}</div>
                        ${gamesHtml}
                    </div>`;
            });
            return html || '<div style="text-align:center;color:#666;padding:1rem;">No roster analytics available.</div>';
        }

        function renderLeaderboardUI() {
            const tbody = document.getElementById('leaderboard-tbody');
            const filterSelect = document.getElementById('leaderboard-sport-filter');
            const scoreHeader = document.getElementById('leaderboard-score-header');
            let allPlayers = [];
            Object.values(window.teamsDataCache).forEach(tp => allPlayers = allPlayers.concat(tp.filter(p => !p.isBench)));

            const discoveredSports = new Set();
            allPlayers.forEach(p => {
                if (p.scoresBySport) Object.keys(p.scoresBySport).forEach(s => {
                    const us = s.toUpperCase();
                    if (us !== 'USER' && us !== 'DRAFT' && us !== 'SPORT') discoveredSports.add(s);
                });
            });

            const currentFilter = window.currentLeaderboardFilter || 'ALL';
            if (filterSelect) {
                filterSelect.innerHTML = `<option value="ALL">All Sports</option>` + Array.from(discoveredSports).sort().map(s => `<option value="${s}" ${currentFilter === s ? 'selected' : ''}>${s}</option>`).join('');
            }
            if (scoreHeader) {
                scoreHeader.textContent = currentFilter === 'ALL' ? 'Total Score' : `${currentFilter} Score`;
            }

            let sorted = [...allPlayers];
            if (currentFilter !== 'ALL') {
                sorted = sorted.filter(p => typeof p.scoresBySport?.[currentFilter] === 'number');
                sorted.sort((a, b) => (b.scoresBySport?.[currentFilter] || 0) - (a.scoresBySport?.[currentFilter] || 0));
            } else {
                sorted.sort((a, b) => b.totalScore - a.totalScore);
            }

            tbody.innerHTML = sorted.map((p, idx) => {
                const sc = currentFilter === 'ALL' ? p.totalScore : p.scoresBySport?.[currentFilter];
                const rank = idx + 1;
                let rankClass = '', rankDisplay = `#${rank}`;
                if (rank === 1) { rankClass = 'rank-1'; rankDisplay = `👑 #${rank}`; }
                else if (rank === 2) { rankClass = 'rank-2'; rankDisplay = `🥈 #${rank}`; }
                else if (rank === 3) { rankClass = 'rank-3'; rankDisplay = `🥉 #${rank}`; }

                const sortedSports = Object.keys(p.scoresBySport || {})
                    .filter(s => {
                        const us = s.toUpperCase();
                        return us !== 'USER' && us !== 'DRAFT' && us !== 'SPORT';
                    })
                    .sort();

                let sportScoresHtml = '';
                if (sortedSports.length > 0) {
                    sportScoresHtml = `<div class="leaderboard-sport-scores">` + sortedSports.map(sport => {
                        const score = p.scoresBySport[sport];
                        const isDup = p.isDuplicate && p.isDuplicate[sport];
                        const isCurrentFilter = currentFilter === sport;
                        const scoreDisplay = typeof score === 'number' ? score.toFixed(2) : '0.00';
                        const activeClass = isCurrentFilter ? 'active-filter' : '';
                        
                        if (isDup) {
                            return `<span class="lb-sport-chip ${activeClass}" style="color: #f87171; border-color: rgba(248,113,113,0.3);"><span class="lb-sport-label" style="color:#f87171;">${sport}:</span> <span class="lb-sport-val" style="color:#f87171;">${scoreDisplay} (D)</span></span>`;
                        }
                        return `<span class="lb-sport-chip ${activeClass}"><span class="lb-sport-label">${sport}:</span> <span class="lb-sport-val">${scoreDisplay}</span></span>`;
                    }).join('') + `</div>`;
                }

                return `
                    <tr>
                        <td class="rank-cell ${rankClass}">${rankDisplay}</td>
                        <td>
                            <div style="font-weight: 700; color: #fff; font-size: 0.95rem;">${p.username}${p.isRookie ? ' <span class="rookie-badge">R</span>' : ''}</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);">${p.team}</div>
                            ${sportScoresHtml}
                        </td>
                        <td class="score-cell">${(sc || 0).toFixed(2)}</td>
                    </tr>`;
            }).join('') || '<tr><td colspan="3" style="text-align:center;color:#666;padding:1.5rem;">No active players found.</td></tr>';
        }

        window.updateLeaderboardFilter = (val) => { window.currentLeaderboardFilter = val; renderLeaderboardUI(); };

        let globalQueueLock = Promise.resolve();
        let nextRequestTime = Date.now();
        let currentPacing = 120;
        let pauseUntil = 0;

        async function processQueueWorker(queue, updateProgress, processSuccessfulData, handleFailedRequest) {
            while (queue.length > 0) {
                const now = Date.now();
                if (now < pauseUntil) {
                    const waitMs = pauseUntil - now;
                    document.getElementById('loading-status').textContent = `Rate limit cooldown: ${Math.ceil(waitMs/1000)}s...`;
                    await new Promise(r => setTimeout(r, Math.min(waitMs, 1000)));
                    continue;
                }

                document.getElementById('loading-status').textContent = 'Fetching scores...';
                let reqData = null;
                await (globalQueueLock = globalQueueLock.then(async () => {
                    reqData = queue.shift();
                    if (!reqData) return;
                    const cur = Date.now();
                    if (nextRequestTime > cur) {
                        const w = nextRequestTime - cur;
                        nextRequestTime += currentPacing;
                        await new Promise(r => setTimeout(r, w));
                    } else {
                        nextRequestTime = cur + currentPacing;
                    }
                }));

                if (!reqData) break;
                if (window.sessionCache[reqData.url]) { processSuccessfulData(reqData, window.sessionCache[reqData.url].data, true); continue; }

                try {
                    const res = await fetchSingleData(reqData.url);
                    if (res.status === 200 && res.data) {
                        processSuccessfulData(reqData, res.data, false);
                    } else if (res.status === 429) {
                        pauseUntil = Date.now() + 3000;
                        currentPacing = Math.min(currentPacing + 50, 400);
                        reqData.retries = (reqData.retries || 0) + 1;
                        if (reqData.retries <= 3) queue.push(reqData);
                        else handleFailedRequest(reqData, 429);
                    } else {
                        handleFailedRequest(reqData, res.status);
                    }
                } catch (e) {
                    handleFailedRequest(reqData, "Network Error");
                }
            }
        }

        async function main(isManualRefresh = false) {
            const loadingDiv = document.getElementById('loading');
            loadingDiv.style.display = 'block';

            if (isManualRefresh) { window.sessionCache = {}; sessionStorage.removeItem('rda_live_cache'); }
            else { window.sessionCache = JSON.parse(sessionStorage.getItem('rda_live_cache') || '{}'); }

            try {
                const seasonConfigs = {
                    '4': {
                        players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7pZmpj4lJiBMkcjcgzJ77n2xmFIRlmuD-0Zuakz8lZekYobXkmTjfaEwhJYdNuM5F9VKlDm-FPaw8/pub?output=csv',
                        schedule: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS93Cbk4JUmCBgtIR1-RnSHlYY9E-dxEEWVT_Jx-T_Lm07oa6KYlnBGAqaGJin4VBpG4GmOGn8ktTPy/pub?gid=1921814921&single=true&output=csv'
                    },
                    '5': {
                        players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7pZmpj4lJiBMkcjcgzJ77n2xmFIRlmuD-0Zuakz8lZekYobXkmTjfaEwhJYdNuM5F9VKlDm-FPaw8/pub?output=csv',
                        schedule: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS93Cbk4JUmCBgtIR1-RnSHlYY9E-dxEEWVT_Jx-T_Lm07oa6KYlnBGAqaGJin4VBpG4GmOGn8ktTPy/pub?gid=44168754&single=true&output=csv'
                    },
                    '6': {
                        players: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR7pZmpj4lJiBMkcjcgzJ77n2xmFIRlmuD-0Zuakz8lZekYobXkmTjfaEwhJYdNuM5F9VKlDm-FPaw8/pub?output=csv',
                        schedule: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS93Cbk4JUmCBgtIR1-RnSHlYY9E-dxEEWVT_Jx-T_Lm07oa6KYlnBGAqaGJin4VBpG4GmOGn8ktTPy/pub?gid=1595040071&single=true&output=csv'
                    }
                };
                const cfg = seasonConfigs[currentSeason] || seasonConfigs['6'];
                const [playersCsv, scheduleCsv] = await Promise.all([fetchCSV(cfg.players), fetchCSV(cfg.schedule)]);
                const todayDateString = getCurrentDateStringEST();

                let dIdx = -1, t1Idx = -1, t2Idx = -1, activeSportsIdx = -1;
                let scheduleStartRow = 1;
                for (let i = 0; i < Math.min(10, scheduleCsv.length); i++) {
                    const headers = scheduleCsv[i].map(h => typeof h === 'string' ? h.toLowerCase().trim() : '');
                    dIdx = findIndex(headers, ["date"]);
                    t1Idx = findIndex(headers, ["team 1","team1","away","away team"]);
                    t2Idx = findIndex(headers, ["team 2","team2","home","home team"]);
                    activeSportsIdx = findIndex(headers, ["active sports", "sports"]);
                    if (dIdx !== -1 && t1Idx !== -1 && t2Idx !== -1) {
                        scheduleStartRow = i + 1;
                        break;
                    }
                }

                window.dailyMatchups = scheduleCsv.slice(scheduleStartRow)
                    .filter(r => isSameDate(r[dIdx], todayDateString))
                    .map((r, i) => ({ 
                        team1: r[t1Idx] ? String(r[t1Idx]).trim() : '', 
                        team2: r[t2Idx] ? String(r[t2Idx]).trim() : '', 
                        activeSports: activeSportsIdx !== -1 ? String(r[activeSportsIdx] || '').trim() : '',
                        id: `matchup-${i}` 
                    })).filter(m => m.team1 && m.team2);

                let uIdx = -1, uidIdx = -1, teamIdx = -1, playIdx = -1, rookieIdx = -1, specificDateIdx = -1;
                let playerStartRow = 1;
                const sportIndices = {};

                for (let i = 0; i < Math.min(10, playersCsv.length); i++) {
                    const headers = playersCsv[i].map(h => typeof h === 'string' ? h.toLowerCase().trim() : '');
                    uIdx = findIndex(headers, ["username"]);
                    uidIdx = findIndex(headers, ["user id","userid"]);
                    teamIdx = findIndex(headers, ["team"]);
                    playIdx = findIndex(headers, ["playing?","playing"]);
                    rookieIdx = findIndex(headers, ["rookie", "rookie?", "is rookie"]);
                    specificDateIdx = findIndex(headers, [todayDateString.toLowerCase()]);

                    if (uIdx !== -1 && uidIdx !== -1 && teamIdx !== -1) {
                        playerStartRow = i + 1;
                        headers.forEach((h, idx) => {
                            const m = h.match(/^([a-z]+) id$/);
                            if (m && !['user','draft','sport'].includes(m[1])) sportIndices[m[1].toUpperCase()] = idx;
                        });
                        break;
                    }
                }

                window.playersToFetch = {};
                window.teamsDataCache = {};
                const allUrls = [];

                playersCsv.slice(playerStartRow).forEach(row => {
                    const userId = cleanId(row[uidIdx]);
                    if (!userId) return;

                    let isPlaying = true;
                    if (specificDateIdx > -1 && row[specificDateIdx] !== undefined && row[specificDateIdx].trim() !== '') {
                        const val = row[specificDateIdx].trim().toLowerCase();
                        isPlaying = val === 'yes' || val === 'true' || val === '1';
                    } else if (playIdx > -1 && row[playIdx] !== undefined && row[playIdx].trim() !== '') {
                        const val = row[playIdx].trim().toLowerCase();
                        isPlaying = val === 'yes' || val === 'true' || val === '1';
                    }

                    const isBench = !isPlaying;
                    const isRookie = rookieIdx > -1 ? row[rookieIdx]?.trim().toLowerCase() === 'yes' : false;
                    const team = row[teamIdx]?.trim() || 'Free Agent';

                    if (!window.playersToFetch[userId]) {
                        if (!window.teamsDataCache[team]) window.teamsDataCache[team] = [];
                        const pData = {
                            username: row[uIdx]?.trim() || `User_${userId.substr(0,4)}`,
                            userId, team, isRookie, isBench,
                            scoresBySport: {}, ranksBySport: {}, lineupsBySport: {},
                            isDuplicate: {}, duplicateWith: {}, totalScore: 0
                        };
                        window.teamsDataCache[team].push(pData);
                        window.playersToFetch[userId] = pData;
                    }

                    for (const s in sportIndices) {
                        const did = row[sportIndices[s]]?.trim();
                        if (did) {
                            allUrls.push({
                                url: `https://web.realsports.io/games/playerratingcontest/${did}/view/${userId}?contestType=sport&source=home`,
                                userId, sport: s, retries: 0
                            });
                        }
                    }
                });

                await fetchRealLifeSchedules(new Set(Object.keys(sportIndices)));

                const uniqueUrlsMap = new Map();
                allUrls.forEach(req => uniqueUrlsMap.set(req.url, req));
                const queue = Array.from(uniqueUrlsMap.values());

                let loaded = 0;
                const total = queue.length;
                const updateProg = () => {
                    loaded++;
                    document.getElementById('loading-text').textContent = `Loading scores... ${loaded}/${total}`;
                    document.getElementById('loading-bar').style.width = `${(loaded/total)*100}%`;
                };

                const parseScoreStr = (str) => parseFloat(String(str).replace(/,/g, '')) || 0;

                const processSuccess = (req, data, fromCache) => {
                    const p = window.playersToFetch[req.userId];
                    if (!p) return;
                    if (!fromCache) window.sessionCache[req.url] = { data, ts: Date.now() };

                    let rankDisplay = '';
                    if (data.info?.rankDisplayInfos?.length > 0) rankDisplay = data.info.rankDisplayInfos[0].rankDisplay || '';
                    else if (data.rankDisplayInfos?.length > 0) rankDisplay = data.rankDisplayInfos[0].rankDisplay || '';
                    else if (data.info?.rankDisplay) rankDisplay = data.info.rankDisplay || '';

                    let extractedLineup = data.lineup || data.playerLineups || data.contestPlayerLineup || [];
                    if (!Array.isArray(extractedLineup)) {
                        if (extractedLineup.players) extractedLineup = extractedLineup.players;
                        else if (extractedLineup.items) extractedLineup = extractedLineup.items;
                        else extractedLineup = [];
                    }

                    let finalScore = 0;
                    if (data.info?.rankDisplayInfos?.length > 0) finalScore = parseScoreStr(data.info.rankDisplayInfos[0].scoreDisplay);
                    else if (data.rankDisplayInfos?.length > 0) finalScore = parseScoreStr(data.rankDisplayInfos[0].scoreDisplay);
                    else if (data.info?.scoreDisplay) finalScore = parseScoreStr(data.info.scoreDisplay);
                    else if (data.info?.score !== undefined) finalScore = parseFloat(data.info.score) || 0;

                    p.scoresBySport[req.sport] = finalScore;
                    p.ranksBySport[req.sport] = rankDisplay;
                    p.lineupsBySport[req.sport] = extractedLineup;

                    const schedMap = window.realLifeSchedules[req.sport] || { games: [], teamToGame: {} };
                    extractedLineup.forEach(item => {
                        const lp = item.player || item;
                        const g = item.game || lp.game || item.matchup;
                        if (g && g.id && !schedMap.games.some(x => x.id === g.id)) {
                            const statusText = g.display?.primary || g.status || g.state || 'Scheduled';
                            const homeTeam = g.homeTeam || {}, awayTeam = g.awayTeam || {};
                            const homeId = homeTeam.id || g.homeTeamId;
                            const awayId = awayTeam.id || g.awayTeamId;
                            const homeName = homeTeam.displayName || homeTeam.name || 'Home';
                            const awayName = awayTeam.displayName || awayTeam.name || 'Away';
                            const gameObj = {
                                id: g.id,
                                homeTeam: { id: homeId, name: homeName },
                                awayTeam: { id: awayId, name: awayName },
                                status: statusText,
                                state: g.state || g.status || '',
                                homeScore: g.display?.homeScoreDisplay ?? g.homeTeamScore ?? 0,
                                awayScore: g.display?.awayScoreDisplay ?? g.awayTeamScore ?? 0
                            };
                            schedMap.games.push(gameObj);
                            if (homeId) schedMap.teamToGame[String(homeId)] = gameObj;
                            if (awayId) schedMap.teamToGame[String(awayId)] = gameObj;
                            if (homeName && homeName !== 'Home') schedMap.teamToGame[homeName.toLowerCase().trim()] = gameObj;
                            if (awayName && awayName !== 'Away') schedMap.teamToGame[awayName.toLowerCase().trim()] = gameObj;
                        }
                    });
                    window.realLifeSchedules[req.sport] = schedMap;

                    p.totalScore = Object.values(p.scoresBySport).reduce((sum, sc) => sum + (typeof sc === 'number' ? sc : 0), 0);
                    updateProg();
                };

                const handleFail = (req) => {
                    const p = window.playersToFetch[req.userId];
                    if (p) p.scoresBySport[req.sport] = 0;
                    updateProg();
                };

                const workers = [];
                for (let i = 0; i < 4; i++) workers.push(processQueueWorker(queue, updateProg, processSuccess, handleFail));
                await Promise.all(workers);

                runDuplicateChecker();
                renderTeamMatchupUI(false);
                loadingDiv.style.display = 'none';

                await fetch(`${workerProxy}snapshot`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timestamp: Date.now(), dailyMatchups: window.dailyMatchups, teamsDataCache: window.teamsDataCache, playersToFetch: window.playersToFetch, realLifeSchedules: window.realLifeSchedules })
                });

                document.getElementById('universal-cache-bar').style.display = 'flex';
                document.getElementById('cache-time-text').textContent = 'Just now';

            } catch (e) {
                loadingDiv.style.display = 'none';
                document.getElementById('results').innerHTML = `<div class="no-games">Error loading live scores: ${e.message}</div>`;
            }
        }

        async function loadSnapshot() {
            try {
                const res = await fetch(`${workerProxy}snapshot`);
                if (!res.ok) return false;
                const snap = await res.json();
                if (!snap || !snap.timestamp) return false;

                window.dailyMatchups = snap.dailyMatchups || [];
                window.teamsDataCache = snap.teamsDataCache || {};
                window.playersToFetch = snap.playersToFetch || {};
                window.realLifeSchedules = snap.realLifeSchedules || {};

                document.getElementById('loading').style.display = 'none';
                document.getElementById('universal-cache-bar').style.display = 'flex';
                document.getElementById('cache-time-text').textContent = new Date(snap.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' ET';
                renderTeamMatchupUI(false);
                return true;
            } catch (e) {
                return false;
            }
        }

        window.triggerUniversalSync = async () => {
            const btn = document.getElementById('cache-refresh-all-btn');
            btn.textContent = 'Syncing...';
            btn.style.pointerEvents = 'none';
            await main(true);
            btn.textContent = '↻ Sync Fresh Scores';
            btn.style.pointerEvents = 'auto';
        };

        (async () => {
            const loaded = await loadSnapshot();
            if (!loaded) main();
        })();
    </script>
